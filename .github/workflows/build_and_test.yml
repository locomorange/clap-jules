name: Build and Test Plugin

on:
  # push:
    # branches: [ main, master ] # Also common to include master
  pull_request:
    # branches: [ main, master ]

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup CLAP Tools and GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y
        
        # Install GUI dependencies for GLFW and OpenGL with retry mechanism
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Verify critical packages are installed and show detailed info
        echo "=== Verifying GUI dependencies ==="
        MISSING_PACKAGES=""
        for pkg in libx11-dev libgl1-mesa-dev libxxf86vm-dev libxfixes-dev; do
          if ! dpkg -l | grep -q "$pkg"; then
            MISSING_PACKAGES="${MISSING_PACKAGES} $pkg"
          else
            echo "✓ $pkg is installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Error: Missing packages:$MISSING_PACKAGES"
          echo "Attempting alternative installation..."
          # Try installing individual packages
          for pkg in $MISSING_PACKAGES; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Warning: Could not install $pkg"
          done
        else
          echo "All critical GUI packages are installed"
        fi
        
        # Download and setup clap-validator with retry
        echo "=== Setting up CLAP tools ==="
        for attempt in 1 2 3; do
          if wget -O clap-validator.tar.gz https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-ubuntu-18.04.tar.gz; then
            break
          else
            echo "Failed to download clap-validator, attempt $attempt"
            sleep 2
          fi
        done
        tar -xzf clap-validator.tar.gz
        chmod +x clap-validator
        
        # Download and setup clap-info with retry
        for attempt in 1 2 3; do
          if wget -O clap-info.zip https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-linux-x64.zip; then
            break
          else
            echo "Failed to download clap-info, attempt $attempt"
            sleep 2
          fi
        done
        unzip -q clap-info.zip
        chmod +x clap-info
        
        # Add current directory to PATH for tool access  
        echo "$PWD" >> $GITHUB_PATH

    - name: Configure CMake
      run: |
        echo "=== Build Environment Debug Info ==="
        echo "CMAKE_SYSTEM_NAME: $(cmake --version | head -1)"
        echo "Operating System: $(uname -a)"
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "libx11-dev|libgl1-mesa-dev|libxxf86vm-dev|libxfixes-dev" || echo "No GUI packages found"
          echo "=== Checking X11 availability ==="
          find /usr -name "X11" -type d 2>/dev/null | head -5
          echo "=== Checking OpenGL availability ==="
          find /usr -name "*gl*" -type f | grep -E "(libGL|libOpenGL)" | head -5
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "=== Windows Build Environment ==="
          echo "MSVC setup:"
          where cl.exe || echo "cl.exe not found"
          echo "OpenGL32 availability:"
          where opengl32.dll || echo "opengl32.dll not found in PATH"
        fi
        echo "=== CMake Configuration ==="
        cmake . -B build

    - name: Build project
      run: cmake --build build --config Release

    - name: Validate CLAP Plugin (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Validate the plugin with clap-validator
        echo "Validating CLAP plugin with clap-validator..."
        clap-validator validate build/MyFirstClapPlugin.so || echo "Validation completed with warnings/errors"
        
        # Get plugin info with clap-info
        echo "Getting plugin info with clap-info..."
        clap-info build/MyFirstClapPlugin.so --brief

    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-windows-${{ github.sha }}
        path: build/Release/MyFirstClapPlugin.clap
        retention-days: 10

    - name: Upload Artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-linux-${{ github.sha }}
        path: build/MyFirstClapPlugin.so
        retention-days: 10

    - name: Upload Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-macos-${{ github.sha }}
        path: build/MyFirstClapPlugin.dylib
        retention-days: 10

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build # Ensures build job completes before test job starts
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup CLAP Tools and GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y
        
        # Install GUI dependencies for GLFW and OpenGL with retry mechanism
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Verify critical packages are installed and show detailed info
        echo "=== Verifying GUI dependencies ==="
        MISSING_PACKAGES=""
        for pkg in libx11-dev libgl1-mesa-dev libxxf86vm-dev libxfixes-dev; do
          if ! dpkg -l | grep -q "$pkg"; then
            MISSING_PACKAGES="${MISSING_PACKAGES} $pkg"
          else
            echo "✓ $pkg is installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Error: Missing packages:$MISSING_PACKAGES"
          echo "Attempting alternative installation..."
          # Try installing individual packages
          for pkg in $MISSING_PACKAGES; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Warning: Could not install $pkg"
          done
        else
          echo "All critical GUI packages are installed"
        fi
        
        # Download and setup clap-validator with retry
        echo "=== Setting up CLAP tools ==="
        for attempt in 1 2 3; do
          if wget -O clap-validator.tar.gz https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-ubuntu-18.04.tar.gz; then
            break
          else
            echo "Failed to download clap-validator, attempt $attempt"
            sleep 2
          fi
        done
        tar -xzf clap-validator.tar.gz
        chmod +x clap-validator
        
        # Download and setup clap-info with retry
        for attempt in 1 2 3; do
          if wget -O clap-info.zip https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-linux-x64.zip; then
            break
          else
            echo "Failed to download clap-info, attempt $attempt"
            sleep 2
          fi
        done
        unzip -q clap-info.zip
        chmod +x clap-info
        
        # Add current directory to PATH for tool access  
        echo "$PWD" >> $GITHUB_PATH

    - name: Configure CMake
      run: |
        echo "=== Test Environment Debug Info ==="
        echo "CMAKE_SYSTEM_NAME: $(cmake --version | head -1)"
        echo "Operating System: $(uname -a)"
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "libx11-dev|libgl1-mesa-dev|libxxf86vm-dev|libxfixes-dev" || echo "No GUI packages found"
          echo "=== Checking X11 availability ==="
          find /usr -name "X11" -type d 2>/dev/null | head -5
          echo "=== Checking OpenGL availability ==="
          find /usr -name "*gl*" -type f | grep -E "(libGL|libOpenGL)" | head -5
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "=== Windows Test Environment ==="
          echo "MSVC setup:"
          where cl.exe || echo "cl.exe not found"
          echo "OpenGL32 availability:"
          where opengl32.dll || echo "opengl32.dll not found in PATH"
        fi
        echo "=== CMake Configuration ==="
        cmake . -B build

    - name: Build project (including tests)
      run: cmake --build build --config Release

    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Validate CLAP Plugin (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Validate the plugin with clap-validator
        echo "Validating CLAP plugin with clap-validator..."
        clap-validator validate build/MyFirstClapPlugin.so || echo "Validation completed with warnings/errors"
        
        # Get plugin info with clap-info
        echo "Getting plugin info with clap-info..."
        clap-info build/MyFirstClapPlugin.so --brief