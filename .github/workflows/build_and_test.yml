name: CLAP Plugin Build and Test Pipeline

on:
  pull_request:
    # branches: [ main, master ]
  # push:
    # branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger for testing

permissions:
  contents: write
  pull-requests: write

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'

jobs:
  # Step 1: Build plugin (foundation for all other jobs)
  build-plugin:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup Dependencies
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-dependencies.sh "$OS_TYPE"

    - name: Setup vcpkg
      shell: bash
      run: |
        echo "=== Setting up vcpkg ==="
        if [ ! -d "vcpkg" ] || [ ! -f "vcpkg/vcpkg" ] && [ ! -f "vcpkg/vcpkg.exe" ]; then
          echo "Cloning vcpkg repository..."
          git clone https://github.com/Microsoft/vcpkg.git vcpkg
        else
          echo "vcpkg directory seems to exist."
        fi

        echo "Bootstrapping vcpkg..."
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

        if [ -z "$VCPKG_ROOT" ]; then
          echo "Setting VCPKG_ROOT environment variable"
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        fi
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH

    - name: Configure CMake
      shell: bash
      run: |
        echo "Setting up vcpkg and CMAKE_TOOLCHAIN_FILE"
        # Ensure vcpkg is bootstrapped (should be done by env setup script if run, but good to be sure)
        if [ -f "vcpkg/bootstrap-vcpkg.sh" ]; then
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        elif [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        else
          echo "Warning: vcpkg bootstrap script not found."
        fi

        # Set CMAKE_TOOLCHAIN_FILE to the project's vcpkg instance
        # VCPKG_ROOT should ideally be set by the overall environment setup.
        # If not, default to ./vcpkg
        EFFECTIVE_VCPKG_ROOT="${VCPKG_ROOT:-$(pwd)/vcpkg}"
        TOOLCHAIN_FILE_PATH="$EFFECTIVE_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        echo "Using VCPKG_ROOT: $EFFECTIVE_VCPKG_ROOT"
        echo "Using CMAKE_TOOLCHAIN_FILE: $TOOLCHAIN_FILE_PATH"

        if [ ! -f "$TOOLCHAIN_FILE_PATH" ]; then
          echo "ERROR: CMAKE_TOOLCHAIN_FILE not found at $TOOLCHAIN_FILE_PATH"
          echo "Listing contents of $EFFECTIVE_VCPKG_ROOT:"
          ls -la "$EFFECTIVE_VCPKG_ROOT"
          echo "Listing contents of $EFFECTIVE_VCPKG_ROOT/scripts:"
          ls -la "$EFFECTIVE_VCPKG_ROOT/scripts"
          echo "Listing contents of $EFFECTIVE_VCPKG_ROOT/scripts/buildsystems:"
          ls -la "$EFFECTIVE_VCPKG_ROOT/scripts/buildsystems"
          exit 1
        fi

        # No longer unset VCPKG_ROOT or CMAKE_TOOLCHAIN_FILE here
        # Instead, explicitly pass the toolchain file.
        cmake . -B build -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE_PATH" -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      shell: bash
      run: |
        # VCPKG_ROOT and CMAKE_TOOLCHAIN_FILE should be respected from configure step
        cmake --build build --config Release

    - name: Verify Plugin Build
      id: verify
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/verify-plugin-build.sh "$OS_TYPE"

    - name: Upload Plugin Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: |
          build/MyFirstClapPlugin.so
          build/Release/MyFirstClapPlugin.clap
          build/MyFirstClapPlugin.dylib
        retention-days: 10
        if-no-files-found: ignore

  # Step 2: Parallel testing jobs (depend on plugin build)
  unit-tests:
    name: Unit Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup Dependencies
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-dependencies.sh "$OS_TYPE"

    - name: Setup vcpkg
      shell: bash
      run: |
        echo "=== Setting up vcpkg ==="
        if [ ! -d "vcpkg" ] || [ ! -f "vcpkg/vcpkg" ] && [ ! -f "vcpkg/vcpkg.exe" ]; then
          echo "Cloning vcpkg repository..."
          git clone https://github.com/Microsoft/vcpkg.git vcpkg
        else
          echo "vcpkg directory seems to exist."
        fi

        echo "Bootstrapping vcpkg..."
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

        if [ -z "$VCPKG_ROOT" ]; then
          echo "Setting VCPKG_ROOT environment variable"
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        fi
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH

    - name: Configure and Build
      shell: bash
      run: |
        echo "Setting up vcpkg and CMAKE_TOOLCHAIN_FILE for unit tests"
        if [ -f "vcpkg/bootstrap-vcpkg.sh" ]; then
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        elif [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        else
          echo "Warning: vcpkg bootstrap script not found."
        fi

        EFFECTIVE_VCPKG_ROOT="${VCPKG_ROOT:-$(pwd)/vcpkg}"
        TOOLCHAIN_FILE_PATH="$EFFECTIVE_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        echo "Using VCPKG_ROOT: $EFFECTIVE_VCPKG_ROOT"
        echo "Using CMAKE_TOOLCHAIN_FILE: $TOOLCHAIN_FILE_PATH"

        if [ ! -f "$TOOLCHAIN_FILE_PATH" ]; then
          echo "ERROR: CMAKE_TOOLCHAIN_FILE not found at $TOOLCHAIN_FILE_PATH for unit tests"
          exit 1
        fi

        cmake . -B build -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE_PATH" -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build -C Release --output-on-failure

  clap-validation:
    name: CLAP Validation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Setup CLAP Tools
      shell: bash
      continue-on-error: true
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-clap-tools.sh "$OS_TYPE" "${{ env.CLAP_VALIDATOR_VERSION }}" "${{ env.CLAP_INFO_VERSION }}"

    - name: Validate CLAP Plugin
      shell: bash
      continue-on-error: true
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/validate-clap-plugin.sh "$OS_TYPE"

  clap-host-test:
    name: CLAP Host Integration Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Cache CLAP Host Build
      uses: actions/cache@v4
      id: clap-host-cache
      with:
        path: |
          clap-host-repo/builds/
          clap-host-repo/vcpkg_installed/
          vcpkg/installed/
        key: clap-host-${{ runner.os }}-qt6-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
        restore-keys: |
          clap-host-${{ runner.os }}-qt6-
          clap-host-${{ runner.os }}-

    - name: Setup CLAP Host Dependencies
      if: steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-dependencies.sh "$OS_TYPE"

    - name: Setup vcpkg
      if: runner.os != 'Windows' && steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-vcpkg.sh "$OS_TYPE"

    - name: Setup MSBuild (Windows)
      if: runner.os == 'Windows' && steps.clap-host-cache.outputs.cache-hit != 'true'
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      if: (runner.os == 'Linux' || runner.os == 'macOS') && steps.clap-host-cache.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        cached: true

    - name: Cache Screenshots for Comparison
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: previous-screenshots/
        key: clap-host-screenshots-${{ matrix.os }}-${{ github.event.pull_request.number || github.ref }}
        restore-keys: |
          clap-host-screenshots-${{ matrix.os }}-

    - name: Verify Plugin Artifact
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/verify-plugin-artifact.sh "$OS_TYPE"

    - name: Prepare CLAP Host
      if: steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ./scripts/prepare-clap-host.sh

    - name: Build CLAP Host
      if: steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        
        if [ "$OS_TYPE" != "windows" ]; then
          export VCPKG_ROOT="${VCPKG_ROOT:-$(pwd)/vcpkg}"
        fi
        
        ./scripts/build-clap-host.sh "$OS_TYPE" "clap-host-repo" "${VCPKG_ROOT:-$(pwd)/vcpkg}"

    - name: Test CLAP Host with Plugin and Take Screenshot
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        
        case "$OS_TYPE" in
          "linux")
            export PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.so"
            ;;
          "windows")
            export PLUGIN_FILE="$(pwd)/plugin-artifacts/Release/MyFirstClapPlugin.clap"
            ;;
          "macos")
            export PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.dylib"
            ;;
        esac
        
        ./scripts/test-clap-host.sh "$OS_TYPE" "clap-host-repo" "$PLUGIN_FILE" "30"

    - name: Upload Screenshot to Release and Comment on PR (Linux only)
      if: runner.os == 'Linux' && github.event_name == 'pull_request'
      shell: bash
      run: |
        if [ "${SCREENSHOT_CHANGED:-false}" = "true" ]; then
          ./scripts/ci/upload-screenshot.sh \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            "${{ github.run_id }}" \
            "${{ github.sha }}" \
            "${NEW_SCREENSHOT_HASH:-unknown}"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Screenshots and Logs
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-test-results-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: |
          screenshots/
          clap-host-repo/builds/
        retention-days: 5
        if-no-files-found: ignore
