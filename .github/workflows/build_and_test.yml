name: Build and Test Plugin

on:
  # push:
    # branches: [ main, master ] # Also common to include master
  pull_request:
    # branches: [ main, master ]

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y
        
        # Install GUI dependencies for GLFW and OpenGL with retry mechanism
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Verify critical packages are installed and show detailed info
        echo "=== Verifying GUI dependencies ==="
        MISSING_PACKAGES=""
        for pkg in libx11-dev libgl1-mesa-dev libxxf86vm-dev libxfixes-dev mesa-utils; do
          if ! dpkg -l | grep -q "$pkg"; then
            MISSING_PACKAGES="${MISSING_PACKAGES} $pkg"
          else
            echo "✓ $pkg is installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Error: Missing packages:$MISSING_PACKAGES"
          echo "Attempting alternative installation..."
          # Try installing individual packages
          for pkg in $MISSING_PACKAGES; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Warning: Could not install $pkg"
          done
        else
          echo "All critical GUI packages are installed"
        fi
        
        # Additional OpenGL diagnostics
        echo "=== OpenGL Diagnostics ==="
        dpkg -l | grep -E "libgl1-mesa-dev|libglu1-mesa-dev" || echo "OpenGL development libs not found!"
        glxinfo | grep "OpenGL" || echo "OpenGL not available (glxinfo failed)"
        

    - name: Configure CMake
      shell: bash
      run: |
        echo "=== Build Environment Debug Info ==="
        echo "CMAKE_SYSTEM_NAME: $(cmake --version | head -1)"
        echo "Operating System: $(uname -a)"
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "libx11-dev|libgl1-mesa-dev|libxxf86vm-dev|libxfixes-dev" || echo "No GUI packages found"
          echo "=== Checking X11 availability ==="
          find /usr -name "X11" -type d 2>/dev/null | head -5 || echo "X11 not found"
          echo "=== Checking OpenGL availability ==="
          find /usr -name "*gl*" -type f | grep -E "(libGL|libOpenGL)" | head -5 || echo "OpenGL libraries not found"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "=== Windows Build Environment ==="
          echo "MSVC setup:"
          where cl.exe || echo "cl.exe not found"
          echo "OpenGL32 availability:"
          where opengl32.dll || echo "opengl32.dll not found in PATH"
        fi
        echo "=== CMake Configuration ==="
        cmake . -B build

    - name: Build project
      run: cmake --build build --config Release


    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-windows-${{ github.sha }}
        path: build/Release/MyFirstClapPlugin.clap
        if-no-files-found: warn
        retention-days: 10

    - name: Upload Artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-linux-${{ github.sha }}
        path: build/MyFirstClapPlugin.so
        if-no-files-found: warn
        retention-days: 10

    - name: Upload Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-macos-${{ github.sha }}
        path: build/MyFirstClapPlugin.dylib
        if-no-files-found: warn
        retention-days: 10

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build # Ensures build job completes before test job starts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}-${{ github.sha }}
        path: build/
        if-no-files-found: ignore

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y
        
        # Install GUI dependencies for GLFW and OpenGL with retry mechanism
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Verify critical packages are installed and show detailed info
        echo "=== Verifying GUI dependencies ==="
        MISSING_PACKAGES=""
        for pkg in libx11-dev libgl1-mesa-dev libxxf86vm-dev libxfixes-dev mesa-utils; do
          if ! dpkg -l | grep -q "$pkg"; then
            MISSING_PACKAGES="${MISSING_PACKAGES} $pkg"
          else
            echo "✓ $pkg is installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Error: Missing packages:$MISSING_PACKAGES"
          echo "Attempting alternative installation..."
          # Try installing individual packages
          for pkg in $MISSING_PACKAGES; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Warning: Could not install $pkg"
          done
        else
          echo "All critical GUI packages are installed"
        fi
        
        # Additional OpenGL diagnostics
        echo "=== OpenGL Diagnostics ==="
        dpkg -l | grep -E "libgl1-mesa-dev|libglu1-mesa-dev" || echo "OpenGL development libs not found!"
        glxinfo | grep "OpenGL" || echo "OpenGL not available (glxinfo failed)"
        

    - name: Setup CLAP Tools
      shell: bash
      run: |
        echo "=== Setting up CLAP tools for ${{ runner.os }} ==="
        
        if [ "$RUNNER_OS" = "Linux" ]; then
          # Download clap-validator for Linux
          wget -O clap-validator.tar.gz "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-ubuntu-18.04.tar.gz" || echo "clap-validator download failed"
          if [ -f clap-validator.tar.gz ]; then
            tar -xzf clap-validator.tar.gz && chmod +x clap-validator || echo "clap-validator extraction failed"
          fi
          
          # Download clap-info for Linux
          wget -O clap-info.zip "https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-linux-x64.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip && chmod +x clap-info || echo "clap-info extraction failed"
          fi
          
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # Download clap-validator for Windows
          curl -L -o clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-windows.zip" || echo "clap-validator download failed"
          if [ -f clap-validator.zip ]; then
            unzip -q clap-validator.zip || echo "clap-validator extraction failed"
          fi
          
          # Download clap-info for Windows
          curl -L -o clap-info.zip "https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-win-x64.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip || echo "clap-info extraction failed"
          fi
          
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "=== Setting up CLAP tools for macOS ==="
          
          # Download clap-validator for macOS
          curl -L -o clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-macos.zip" || echo "clap-validator download failed"
          if [ -f clap-validator.zip ]; then
            unzip -q clap-validator.zip && chmod +x clap-validator || echo "clap-validator extraction failed"
          fi
          
          # Download clap-info for macOS
          curl -L -o clap-info.zip "https://github.com/free-audio/clap-info/releases/download/v1.2.2/clap-info-mac-universal.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip && chmod +x clap-info || echo "clap-info extraction failed"
          fi
        fi
        
        # Add current directory to PATH for tool access
        echo "$PWD" >> $GITHUB_PATH
        
        # Verify tools are available
        echo "=== Verifying CLAP tools ==="
        if [ "$RUNNER_OS" = "Windows" ]; then
          if [ -f "./clap-validator.exe" ]; then
            ./clap-validator.exe --version || echo "clap-validator available but version check failed"
          else
            echo "clap-validator.exe not available"
          fi
          if [ -f "./clap-info.exe" ]; then
            ./clap-info.exe --version || echo "clap-info available but version check failed"
          else
            echo "clap-info.exe not available"
          fi
        else
          if [ -f "./clap-validator" ]; then
            ./clap-validator --version || echo "clap-validator available but version check failed"
          else
            echo "clap-validator not available"
          fi
          if [ -f "./clap-info" ]; then
            ./clap-info --version || echo "clap-info available but version check failed"
          else
            echo "clap-info not available"
          fi
        fi
    - name: Configure CMake
      shell: bash
      run: |
        echo "=== Test Environment Debug Info ==="
        echo "CMAKE_SYSTEM_NAME: $(cmake --version | head -1)"
        echo "Operating System: $(uname -a)"
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "libx11-dev|libgl1-mesa-dev|libxxf86vm-dev|libxfixes-dev" || echo "No GUI packages found"
          echo "=== Checking X11 availability ==="
          find /usr -name "X11" -type d 2>/dev/null | head -5 || echo "X11 not found"
          echo "=== Checking OpenGL availability ==="
          find /usr -name "*gl*" -type f | grep -E "(libGL|libOpenGL)" | head -5 || echo "OpenGL libraries not found"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "=== Windows Test Environment ==="
          echo "MSVC setup:"
          where cl.exe || echo "cl.exe not found"
          echo "OpenGL32 availability:"
          where opengl32.dll || echo "opengl32.dll not found in PATH"
        fi
        echo "=== CMake Configuration ==="
        cmake . -B build

    - name: Build project (including tests)
      run: cmake --build build --config Release

    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Validate CLAP Plugin
      shell: bash
      run: |
        echo "=== Validating CLAP plugin on ${{ runner.os }} ==="
        
        if [ "$RUNNER_OS" = "Linux" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.so"
          VALIDATOR_CMD="./clap-validator"
          INFO_CMD="./clap-info"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          PLUGIN_FILE="build/Release/MyFirstClapPlugin.clap"
          VALIDATOR_CMD="./clap-validator.exe"
          INFO_CMD="./clap-info.exe"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.dylib"
          VALIDATOR_CMD="./clap-validator"
          INFO_CMD="./clap-info"
        fi
        
        echo "Plugin file: $PLUGIN_FILE"
        
        if [ -f "$PLUGIN_FILE" ]; then
          # Validate the plugin with clap-validator
          if [ -f "$VALIDATOR_CMD" ] || [ -f "${VALIDATOR_CMD}.exe" ]; then
            echo "Validating CLAP plugin with clap-validator..."
            $VALIDATOR_CMD validate "$PLUGIN_FILE" || echo "Validation completed with warnings/errors"
          else
            echo "Warning: clap-validator not available on ${{ runner.os }} - skipping validation"
          fi
          
          # Get plugin info with clap-info
          if [ -f "$INFO_CMD" ] || [ -f "${INFO_CMD}.exe" ]; then
            echo "Getting plugin info with clap-info..."
            $INFO_CMD "$PLUGIN_FILE" --brief || echo "Info extraction completed"
          else
            echo "Warning: clap-info not available on ${{ runner.os }} - skipping info extraction"
          fi
        else
          echo "Error: Plugin file $PLUGIN_FILE not found!"
          exit 1
        fi

  clap-host-build:
    name: Build CLAP Host on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build # Wait for plugin build to complete
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup CLAP Host Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y

        # Install essential build tools and GUI dependencies
        echo "Installing build tools and GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            ninja-build \
            cmake \
            git \
            curl \
            zip \
            unzip \
            tar; then
            echo "Dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done

        # Install vcpkg for dependency management
        echo "=== Setting up vcpkg ==="
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        ./vcpkg/bootstrap-vcpkg.sh
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH

    - name: Setup CLAP Host Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Installing essential build tools on macOS..."
        brew install pkg-config ninja cmake git curl

        # Install vcpkg for dependency management
        echo "=== Setting up vcpkg ==="
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        ./vcpkg/bootstrap-vcpkg.sh
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH

    - name: Setup CLAP Host Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "Setting up vcpkg and build tools on Windows..."
        # Install vcpkg for dependency management
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        echo "$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_PATH

    - name: Setup MSBuild (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Checkout CLAP Host
      run: |
        echo "Cloning clap-host repository..."
        git clone --recurse-submodules https://github.com/free-audio/clap-host.git clap-host-repo

    - name: Build CLAP Host (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on ${{ runner.os }} ==="

        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"

        # Try different build approaches
        BUILD_SUCCESS=false

        # Manual build with vcpkg toolchain
        echo "Trying manual build with vcpkg toolchain"
        if cmake . -B builds/vcpkg-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
          -DVCPKG_TARGET_TRIPLET=${{ runner.os == 'macOS' && 'arm64-osx' || 'x64-linux' }}; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi

        # Fallback to preset if vcpkg manual build failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "vcpkg manual build failed, trying ninja-system preset"
          if cmake --preset ninja-system; then
            echo "ninja-system preset configuration successful"
            if cmake --build --preset ninja-system; then
              echo "ninja-system preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        # Last resort: simple cmake build
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "All advanced builds failed, trying simple build"
          if cmake . -B builds/simple -G Ninja -DCMAKE_BUILD_TYPE=Release; then
            echo "Simple configuration successful"
            if cmake --build builds/simple --config Release; then
              echo "Simple build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed"
          exit 1
        fi

        # Find and verify the built executable
        echo "=== Finding CLAP Host executable ==="
        CLAP_HOST_EXEC=$(find builds -name "clap-host" -type f | head -1)
        if [ -n "$CLAP_HOST_EXEC" ]; then
          echo "Found clap-host at: $CLAP_HOST_EXEC"
          chmod +x "$CLAP_HOST_EXEC"
          echo "CLAP_HOST_PATH=$CLAP_HOST_EXEC" >> $GITHUB_ENV
        else
          echo "Error: clap-host executable not found!"
          find . -name "*clap*" -type f
          exit 1
        fi

    - name: Build CLAP Host (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on Windows ==="

        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"

        # Try different build approaches
        BUILD_SUCCESS=false

        # Try manual build with vcpkg first
        echo "Trying manual build with vcpkg toolchain"
        if cmake . -B builds/vcpkg-build \
           -DCMAKE_BUILD_TYPE=Release \
           -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
           -DVCPKG_TARGET_TRIPLET=x64-windows; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi

        # Try vs-vcpkg preset if manual vcpkg failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "Trying vs-vcpkg preset"
          if cmake --preset vs-vcpkg; then
            echo "vs-vcpkg preset configuration successful"
            if cmake --build --preset vs-vcpkg --config Release; then
              echo "vs-vcpkg preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        # Manual build as last resort
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "Trying simple manual build for Windows"
          if cmake . -B builds/windows -DCMAKE_BUILD_TYPE=Release; then
            echo "Manual configuration successful"
            if cmake --build builds/windows --config Release; then
              echo "Manual build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed on Windows"
          exit 1
        fi

        # Find and verify the built executable
        echo "=== Finding CLAP Host executable ==="
        CLAP_HOST_EXEC=$(find builds -name "clap-host.exe" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          CLAP_HOST_EXEC=$(find builds -name "clap-host" -type f | head -1)
        fi
        
        if [ -n "$CLAP_HOST_EXEC" ]; then
          echo "Found clap-host at: $CLAP_HOST_EXEC"
          # Convert to Windows path format
          CLAP_HOST_EXEC=$(cygpath -w "$CLAP_HOST_EXEC" 2>/dev/null || echo "$CLAP_HOST_EXEC")
          echo "Windows path: $CLAP_HOST_EXEC"
          echo "CLAP_HOST_PATH=$CLAP_HOST_EXEC" >> $GITHUB_ENV
          
          # Verify executable exists and is valid
          if [ -f "$CLAP_HOST_EXEC" ]; then
            echo "Executable verified at: $CLAP_HOST_EXEC"
            ls -la "$CLAP_HOST_EXEC"
          else
            echo "Error: Executable not found at converted path: $CLAP_HOST_EXEC"
            exit 1
          fi
        else
          echo "Error: clap-host executable not found!"
          find . -name "*clap*" -type f
          exit 1
        fi

    - name: Upload CLAP Host Executable
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}-${{ github.sha }}
        path: |
          clap-host-repo/builds/*/clap-host*
          !clap-host-repo/builds/**/CMakeFiles/
        retention-days: 10

  clap-host-test:
    name: Test CLAP Host on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build, clap-host-build] # Wait for both plugin and CLAP host builds
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}-${{ github.sha }}
        path: plugin/
        if-no-files-found: ignore

    - name: Download CLAP Host Artifacts
      uses: actions/download-artifact@v4
      with:
        name: clap-host-${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}-${{ github.sha }}
        path: clap-host-repo/
        if-no-files-found: ignore

    - name: Setup Test Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          xvfb \
          x11-utils \
          imagemagick \
          mesa-utils

    - name: Test CLAP Host with Plugin (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on Linux ==="

        # Find clap-host executable
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"

        # Plugin path
        PLUGIN_FILE="$(pwd)/plugin/MyFirstClapPlugin.so"
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          ls -la plugin/
          exit 1
        fi

        # Create screenshot directory
        mkdir -p screenshots

        # Test clap-host with virtual display
        echo "Starting virtual display..."
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
        XVFB_PID=$!
        sleep 5

        # Test clap-host help first
        echo "=== Testing clap-host help ==="
        "$CLAP_HOST_EXEC" --help || echo "Help command failed"

        # Run clap-host with plugin and take screenshot
        echo "=== Running clap-host with plugin ==="
        timeout 30s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 15  # Wait for GUI to load
          import -window root screenshots/clap-host-linux-screenshot.png 2>/dev/null || echo 'Screenshot failed'
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "Screenshot capture completed (timeout expected)"

        # Stop virtual display
        kill $XVFB_PID 2>/dev/null || true

        echo "CLAP Host test completed on Linux"

    - name: Test CLAP Host with Plugin (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on macOS ==="

        # Find clap-host executable
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"

        # Plugin path
        PLUGIN_FILE="$(pwd)/plugin/MyFirstClapPlugin.dylib"
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          ls -la plugin/
          exit 1
        fi

        # Create screenshot directory
        mkdir -p screenshots

        # Test clap-host help first
        echo "=== Testing clap-host help ==="
        "$CLAP_HOST_EXEC" --help || echo "Help command failed"

        # Run clap-host with plugin and take screenshot
        echo "Running clap-host and taking screenshot..."
        timeout 30s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 15  # Wait for GUI to load
          screencapture -x screenshots/clap-host-macos-screenshot.png
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "Screenshot capture completed (timeout expected)"

        echo "CLAP Host test completed on macOS"

    - name: Test CLAP Host with Plugin (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on Windows ==="

        # Find clap-host executable with better pattern matching
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host.exe" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        fi

        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          echo "=== Directory listing ==="
          find clap-host-repo -name "*clap*" -type f
          exit 1
        fi

        echo "Found clap-host at: $CLAP_HOST_EXEC"

        # Verify executable exists and is accessible
        if [ ! -f "$CLAP_HOST_EXEC" ]; then
          echo "Error: Executable path does not exist: $CLAP_HOST_EXEC"
          exit 1
        fi

        # Get file size for validation
        FILE_SIZE=$(stat -c%s "$CLAP_HOST_EXEC" 2>/dev/null || wc -c < "$CLAP_HOST_EXEC")
        echo "Executable file size: $FILE_SIZE bytes"
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "Warning: Executable appears to be very small, might be invalid"
        fi

        # Plugin path
        PLUGIN_FILE="$(pwd)/plugin/MyFirstClapPlugin.clap"
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          ls -la plugin/
          exit 1
        fi

        # Create screenshot directory
        mkdir -p screenshots

        # Test clap-host help first
        echo "=== Testing clap-host help ==="
        "$CLAP_HOST_EXEC" --help || echo "Help command failed: $?"

        # Test basic execution to ensure the executable works
        echo "=== Testing clap-host version ==="
        "$CLAP_HOST_EXEC" --version || echo "Version command failed: $?"

        echo "CLAP Host basic tests completed on Windows"

    - name: Upload Test Screenshots and Logs
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-test-results-${{ matrix.os }}-${{ github.sha }}
        path: |
          screenshots/
        retention-days: 30
        if-no-files-found: ignore
