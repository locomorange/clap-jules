name: Build and Test Plugin

on:
  # push:
    # branches: [ main, master ] # Also common to include master
  pull_request:
    # branches: [ main, master ]

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y
        
        # Install GUI dependencies for GLFW and OpenGL with retry mechanism
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Verify critical packages are installed and show detailed info
        echo "=== Verifying GUI dependencies ==="
        MISSING_PACKAGES=""
        for pkg in libx11-dev libgl1-mesa-dev libxxf86vm-dev libxfixes-dev mesa-utils; do
          if ! dpkg -l | grep -q "$pkg"; then
            MISSING_PACKAGES="${MISSING_PACKAGES} $pkg"
          else
            echo "✓ $pkg is installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Error: Missing packages:$MISSING_PACKAGES"
          echo "Attempting alternative installation..."
          # Try installing individual packages
          for pkg in $MISSING_PACKAGES; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Warning: Could not install $pkg"
          done
        else
          echo "All critical GUI packages are installed"
        fi
        
        # Additional OpenGL diagnostics
        echo "=== OpenGL Diagnostics ==="
        dpkg -l | grep -E "libgl1-mesa-dev|libglu1-mesa-dev" || echo "OpenGL development libs not found!"
        glxinfo | grep "OpenGL" || echo "OpenGL not available (glxinfo failed)"
        

    - name: Configure CMake
      shell: bash
      run: |
        echo "=== Build Environment Debug Info ==="
        echo "CMAKE_SYSTEM_NAME: $(cmake --version | head -1)"
        echo "Operating System: $(uname -a)"
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "libx11-dev|libgl1-mesa-dev|libxxf86vm-dev|libxfixes-dev" || echo "No GUI packages found"
          echo "=== Checking X11 availability ==="
          find /usr -name "X11" -type d 2>/dev/null | head -5 || echo "X11 not found"
          echo "=== Checking OpenGL availability ==="
          find /usr -name "*gl*" -type f | grep -E "(libGL|libOpenGL)" | head -5 || echo "OpenGL libraries not found"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "=== Windows Build Environment ==="
          echo "MSVC setup:"
          where cl.exe || echo "cl.exe not found"
          echo "OpenGL32 availability:"
          where opengl32.dll || echo "opengl32.dll not found in PATH"
        fi
        echo "=== CMake Configuration ==="
        cmake . -B build

    - name: Build project
      run: cmake --build build --config Release


    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-windows-${{ github.sha }}
        path: build/Release/MyFirstClapPlugin.clap
        retention-days: 10

    - name: Upload Artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-linux-${{ github.sha }}
        path: build/MyFirstClapPlugin.so
        retention-days: 10

    - name: Upload Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-macos-${{ github.sha }}
        path: build/MyFirstClapPlugin.dylib
        retention-days: 10

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build # Ensures build job completes before test job starts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y
        
        # Install GUI dependencies for GLFW and OpenGL with retry mechanism
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Verify critical packages are installed and show detailed info
        echo "=== Verifying GUI dependencies ==="
        MISSING_PACKAGES=""
        for pkg in libx11-dev libgl1-mesa-dev libxxf86vm-dev libxfixes-dev mesa-utils; do
          if ! dpkg -l | grep -q "$pkg"; then
            MISSING_PACKAGES="${MISSING_PACKAGES} $pkg"
          else
            echo "✓ $pkg is installed"
          fi
        done
        
        if [ -n "$MISSING_PACKAGES" ]; then
          echo "Error: Missing packages:$MISSING_PACKAGES"
          echo "Attempting alternative installation..."
          # Try installing individual packages
          for pkg in $MISSING_PACKAGES; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Warning: Could not install $pkg"
          done
        else
          echo "All critical GUI packages are installed"
        fi
        
        # Additional OpenGL diagnostics
        echo "=== OpenGL Diagnostics ==="
        dpkg -l | grep -E "libgl1-mesa-dev|libglu1-mesa-dev" || echo "OpenGL development libs not found!"
        glxinfo | grep "OpenGL" || echo "OpenGL not available (glxinfo failed)"
        

    - name: Setup CLAP Tools
      shell: bash
      run: |
        echo "=== Setting up CLAP tools for ${{ runner.os }} ==="
        
        if [ "$RUNNER_OS" = "Linux" ]; then
          # Download clap-validator for Linux
          wget -O clap-validator.tar.gz "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-ubuntu-18.04.tar.gz" || echo "clap-validator download failed"
          if [ -f clap-validator.tar.gz ]; then
            tar -xzf clap-validator.tar.gz && chmod +x clap-validator || echo "clap-validator extraction failed"
          fi
          
          # Download clap-info for Linux
          wget -O clap-info.zip "https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-linux-x64.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip && chmod +x clap-info || echo "clap-info extraction failed"
          fi
          
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # Download clap-validator for Windows
          curl -L -o clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-windows.zip" || echo "clap-validator download failed"
          if [ -f clap-validator.zip ]; then
            unzip -q clap-validator.zip || echo "clap-validator extraction failed"
          fi
          
          # Download clap-info for Windows
          curl -L -o clap-info.zip "https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-win-x64.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip || echo "clap-info extraction failed"
          fi
          
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "=== Setting up CLAP tools for macOS ==="
          
          # Download clap-validator for macOS
          curl -L -o clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-macos.zip" || echo "clap-validator download failed"
          if [ -f clap-validator.zip ]; then
            unzip -q clap-validator.zip && chmod +x clap-validator || echo "clap-validator extraction failed"
          fi
          
          # Download clap-info for macOS
          curl -L -o clap-info.zip "https://github.com/free-audio/clap-info/releases/download/v1.2.2/clap-info-mac-universal.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip && chmod +x clap-info || echo "clap-info extraction failed"
          fi
        fi
        
        # Add current directory to PATH for tool access
        echo "$PWD" >> $GITHUB_PATH
        
        # Verify tools are available
        echo "=== Verifying CLAP tools ==="
        if [ "$RUNNER_OS" = "Windows" ]; then
          if [ -f "./clap-validator.exe" ]; then
            ./clap-validator.exe --version || echo "clap-validator available but version check failed"
          else
            echo "clap-validator.exe not available"
          fi
          if [ -f "./clap-info.exe" ]; then
            ./clap-info.exe --version || echo "clap-info available but version check failed"
          else
            echo "clap-info.exe not available"
          fi
        else
          if [ -f "./clap-validator" ]; then
            ./clap-validator --version || echo "clap-validator available but version check failed"
          else
            echo "clap-validator not available"
          fi
          if [ -f "./clap-info" ]; then
            ./clap-info --version || echo "clap-info available but version check failed"
          else
            echo "clap-info not available"
          fi
        fi
    - name: Configure CMake
      shell: bash
      run: |
        echo "=== Test Environment Debug Info ==="
        echo "CMAKE_SYSTEM_NAME: $(cmake --version | head -1)"
        echo "Operating System: $(uname -a)"
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "=== Checking installed packages ==="
          dpkg -l | grep -E "libx11-dev|libgl1-mesa-dev|libxxf86vm-dev|libxfixes-dev" || echo "No GUI packages found"
          echo "=== Checking X11 availability ==="
          find /usr -name "X11" -type d 2>/dev/null | head -5 || echo "X11 not found"
          echo "=== Checking OpenGL availability ==="
          find /usr -name "*gl*" -type f | grep -E "(libGL|libOpenGL)" | head -5 || echo "OpenGL libraries not found"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "=== Windows Test Environment ==="
          echo "MSVC setup:"
          where cl.exe || echo "cl.exe not found"
          echo "OpenGL32 availability:"
          where opengl32.dll || echo "opengl32.dll not found in PATH"
        fi
        echo "=== CMake Configuration ==="
        cmake . -B build

    - name: Build project (including tests)
      run: cmake --build build --config Release

    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Validate CLAP Plugin
      shell: bash
      run: |
        echo "=== Validating CLAP plugin on ${{ runner.os }} ==="
        
        if [ "$RUNNER_OS" = "Linux" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.so"
          VALIDATOR_CMD="./clap-validator"
          INFO_CMD="./clap-info"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          PLUGIN_FILE="build/Release/MyFirstClapPlugin.clap"
          VALIDATOR_CMD="./clap-validator.exe"
          INFO_CMD="./clap-info.exe"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.dylib"
          VALIDATOR_CMD="./clap-validator"
          INFO_CMD="./clap-info"
        fi
        
        echo "Plugin file: $PLUGIN_FILE"
        
        if [ -f "$PLUGIN_FILE" ]; then
          # Validate the plugin with clap-validator
          if [ -f "$VALIDATOR_CMD" ] || [ -f "${VALIDATOR_CMD}.exe" ]; then
            echo "Validating CLAP plugin with clap-validator..."
            $VALIDATOR_CMD validate "$PLUGIN_FILE" || echo "Validation completed with warnings/errors"
          else
            echo "Warning: clap-validator not available on ${{ runner.os }} - skipping validation"
          fi
          
          # Get plugin info with clap-info
          if [ -f "$INFO_CMD" ] || [ -f "${INFO_CMD}.exe" ]; then
            echo "Getting plugin info with clap-info..."
            $INFO_CMD "$PLUGIN_FILE" --brief || echo "Info extraction completed"
          else
            echo "Warning: clap-info not available on ${{ runner.os }} - skipping info extraction"
          fi
        else
          echo "Error: Plugin file $PLUGIN_FILE not found!"
          exit 1
        fi

  clap-host-test:
    name: CLAP Host Integration Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build # Runs after plugin build completes
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Cache CLAP Host Build
      uses: actions/cache@v4
      id: clap-host-cache
      with:
        path: |
          clap-host-repo/builds/
          clap-host-repo/vcpkg_installed/
        key: clap-host-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
        restore-keys: |
          clap-host-${{ runner.os }}-

    - name: Setup CLAP Host Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        # Update package database
        sudo apt-get update -y

        # Install only essential build tools and GUI dependencies
        # Let clap-host handle rtaudio/rtmidi via vcpkg to avoid version conflicts
        echo "Installing build tools and GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils \
            ninja-build \
            cmake \
            git \
            curl \
            zip \
            unzip \
            tar \
            xvfb \
            x11-utils \
            imagemagick \
            scrot; then
            echo "Dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done

        # Install vcpkg for dependency management
        echo "=== Setting up vcpkg ==="
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        ./vcpkg/bootstrap-vcpkg.sh
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH

    - name: Setup CLAP Host Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Installing essential build tools on macOS..."
        # Only install build tools, let clap-host handle audio dependencies
        brew install pkg-config ninja cmake git curl

        # Install vcpkg for dependency management
        echo "=== Setting up vcpkg ==="
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        ./vcpkg/bootstrap-vcpkg.sh
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH

    - name: Setup CLAP Host Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "Setting up vcpkg and build tools on Windows..."
        # Install vcpkg for dependency management
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        echo "$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_PATH

    - name: Setup MSBuild (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Checkout CLAP Host
      if: steps.clap-host-cache.outputs.cache-hit != 'true'
      run: |
        echo "Cloning clap-host repository..."
        git clone --recurse-submodules https://github.com/free-audio/clap-host.git clap-host-repo

    - name: Build CLAP Host (Linux/macOS)
      if: runner.os != 'Windows' && steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on ${{ runner.os }} ==="

        # Create screenshots directory for potential error logs
        mkdir -p ../screenshots

        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"

        # Check available presets
        echo "Available CMake presets:"
        cmake --list-presets 2>/dev/null || echo "No presets available"

        # Try vcpkg-based build first
        BUILD_SUCCESS=false

        # Manual build with vcpkg toolchain
        echo "Trying manual build with vcpkg toolchain"
        if cmake . -B builds/vcpkg-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
          -DVCPKG_TARGET_TRIPLET=${{ runner.os == 'macOS' && 'arm64-osx' || 'x64-linux' }} \
          2>&1 | tee ../screenshots/cmake-vcpkg-configure-log-${{ runner.os }}.txt; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release 2>&1 | tee ../screenshots/cmake-vcpkg-build-log-${{ runner.os }}.txt; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi

        # Fallback to preset if vcpkg manual build failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "vcpkg manual build failed, trying ninja-system preset"
          if cmake --preset ninja-system 2>&1 | tee ../screenshots/cmake-preset-configure-log-${{ runner.os }}.txt; then
            echo "ninja-system preset configuration successful"
            if cmake --build --preset ninja-system 2>&1 | tee ../screenshots/cmake-preset-build-log-${{ runner.os }}.txt; then
              echo "ninja-system preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        # Last resort: simple cmake build without specific dependencies
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "All advanced builds failed, trying simple build"
          if cmake . -B builds/simple -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../screenshots/cmake-simple-configure-log-${{ runner.os }}.txt; then
            echo "Simple configuration successful"
            if cmake --build builds/simple --config Release 2>&1 | tee ../screenshots/cmake-simple-build-log-${{ runner.os }}.txt; then
              echo "Simple build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed"
          echo "Build failed on ${{ runner.os }}" > ../screenshots/build-failed-${{ runner.os }}.txt
          exit 1
        fi

        # Find the built executable
        echo "=== Finding CLAP Host executable ==="
        find builds -name "clap-host*" -type f 2>/dev/null | tee ../screenshots/found-executables-${{ runner.os }}.txt || echo "No clap-host executable found"
        find . -name "clap-host*" -type f 2>/dev/null | tee -a ../screenshots/found-executables-${{ runner.os }}.txt || echo "No clap-host executable found anywhere"

    - name: Build CLAP Host (Windows)
      if: runner.os == 'Windows' && steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on Windows ==="

        # Create screenshots directory for potential error logs
        mkdir -p ../screenshots

        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"

        # Check available presets
        echo "Available CMake presets:"
        cmake --list-presets 2>/dev/null || echo "No presets available"

        # Try different build approaches
        BUILD_SUCCESS=false

        # Try manual build with external vcpkg first
        echo "Trying manual build with external vcpkg"
        if cmake . -B builds/vcpkg-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
          -DVCPKG_TARGET_TRIPLET=x64-windows \
          2>&1 | tee ../screenshots/cmake-vcpkg-configure-log-windows.txt; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release 2>&1 | tee ../screenshots/cmake-vcpkg-build-log-windows.txt; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi

        # Fallback to ninja-vcpkg preset if manual vcpkg failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "External vcpkg manual build failed, trying ninja-vcpkg preset"
          
          # Initialize built-in vcpkg if it doesn't exist
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/Microsoft/vcpkg.git vcpkg
            cd vcpkg && ./bootstrap-vcpkg.bat && cd ..
          fi
          
          if cmake --preset ninja-vcpkg 2>&1 | tee ../screenshots/cmake-preset-configure-log-windows.txt; then
            echo "ninja-vcpkg preset configuration successful"
            if cmake --build --preset ninja-vcpkg 2>&1 | tee ../screenshots/cmake-preset-build-log-windows.txt; then
              echo "ninja-vcpkg preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        # Final fallback: vs-vcpkg preset
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ninja-vcpkg failed, trying vs-vcpkg preset"
          if cmake --preset vs-vcpkg 2>&1 | tee ../screenshots/cmake-vs-configure-log-windows.txt; then
            echo "vs-vcpkg preset configuration successful"
            if cmake --build --preset vs-vcpkg --config Release 2>&1 | tee ../screenshots/cmake-vs-build-log-windows.txt; then
              echo "vs-vcpkg preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed"
          echo "Build failed on Windows" > ../screenshots/build-failed-windows.txt
          exit 1
        fi

        # Find the built executable
        echo "=== Finding CLAP Host executable ==="
        find builds -name "clap-host*" -type f 2>/dev/null | tee ../screenshots/found-executables-windows.txt || echo "No clap-host executable found"
        find . -name "clap-host*" -type f 2>/dev/null | tee -a ../screenshots/found-executables-windows.txt || echo "No clap-host executable found anywhere"

    - name: Test CLAP Host with Plugin and Take Screenshot (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on Linux ==="
        
        # Find clap-host executable
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f | head -10
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"
        
        # Plugin path from downloaded artifacts
        PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.so"
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          ls -la plugin-artifacts/
          exit 1
        fi
        
        mkdir -p screenshots
        
        # Test with virtual display and take screenshot
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
        XVFB_PID=$!
        sleep 5
        
        # Test clap-host and take screenshot
        timeout 30s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 15
          import -window root screenshots/clap-host-linux-screenshot.png 2>/dev/null || scrot screenshots/clap-host-linux-screenshot.png 2>/dev/null || echo 'Screenshot failed'
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "Screenshot capture completed"
        
        kill $XVFB_PID 2>/dev/null || true
        
        # Verify screenshot
        if [ -f "screenshots/clap-host-linux-screenshot.png" ]; then
          echo "Screenshot captured successfully"
          ls -la screenshots/clap-host-linux-screenshot.png
        else
          echo "Screenshot failed, capturing diagnostic info"
          echo "Screenshot failed on Linux" > screenshots/error-linux.txt
          "$CLAP_HOST_EXEC" --version > screenshots/clap-host-version-linux.txt 2>&1 || echo "Version check failed"
        fi

    - name: Test CLAP Host with Plugin and Take Screenshot (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on macOS ==="
        
        # Find clap-host executable
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f | head -10
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"
        
        # Plugin path from downloaded artifacts
        PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.dylib"
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          ls -la plugin-artifacts/
          exit 1
        fi
        
        mkdir -p screenshots
        
        # Test clap-host and take screenshot
        timeout 30s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 15
          screencapture -x screenshots/clap-host-macos-screenshot.png
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "Screenshot capture completed"
        
        # Verify screenshot
        if [ -f "screenshots/clap-host-macos-screenshot.png" ]; then
          echo "Screenshot captured successfully"
          ls -la screenshots/clap-host-macos-screenshot.png
        else
          echo "Screenshot failed, capturing diagnostic info"
          echo "Screenshot failed on macOS" > screenshots/error-macos.txt
          "$CLAP_HOST_EXEC" --version > screenshots/clap-host-version-macos.txt 2>&1 || echo "Version check failed"
        fi

    - name: Test CLAP Host with Plugin and Take Screenshot (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Write-Host "=== Testing CLAP Host with Plugin on Windows ==="
        
        # Find clap-host executable
        $clapHostFiles = Get-ChildItem -Path "clap-host-repo" -Name "clap-host*.exe" -File -Recurse -ErrorAction SilentlyContinue
        if (-not $clapHostFiles) {
          $clapHostFiles = Get-ChildItem -Path "clap-host-repo" -Name "clap-host" -File -Recurse -ErrorAction SilentlyContinue
        }
        
        if (-not $clapHostFiles) {
          Write-Host "Error: clap-host executable not found!"
          Get-ChildItem -Path "clap-host-repo/builds" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20
          exit 1
        }
        
        $clapHostExe = $clapHostFiles | Select-Object -First 1
        $clapHostPath = Get-ChildItem -Path "clap-host-repo" -Name $clapHostExe -File -Recurse | Select-Object -First 1
        $clapHostFullPath = Join-Path "clap-host-repo" $clapHostPath
        Write-Host "Found clap-host at: $clapHostFullPath"
        
        # Plugin path from downloaded artifacts
        $pluginFile = Join-Path (Get-Location) "plugin-artifacts/MyFirstClapPlugin.clap"
        if (-not (Test-Path $pluginFile)) {
          Write-Host "Error: Plugin file not found at $pluginFile"
          Get-ChildItem "plugin-artifacts/"
          exit 1
        }
        
        New-Item -ItemType Directory -Force -Path "screenshots"
        
        # Test clap-host and take screenshot
        try {
          $process = Start-Process -FilePath $clapHostFullPath -ArgumentList "-p", $pluginFile -PassThru -WindowStyle Normal -ErrorAction Stop
          Write-Host "Started clap-host process with PID: $($process.Id)"
          Start-Sleep -Seconds 20
          
          # Take screenshot using .NET
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("screenshots/clap-host-windows-screenshot.png")
          
          $graphics.Dispose()
          $bitmap.Dispose()
          
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          
          Write-Host "Screenshot captured successfully"
          Get-ChildItem "screenshots/clap-host-windows-screenshot.png"
        } catch {
          Write-Host "Screenshot capture failed: $_"
          "Screenshot failed: $_" | Out-File -FilePath "screenshots/error-windows.txt"
          try {
            & $clapHostFullPath --version 2>1 | Out-File -FilePath "screenshots/clap-host-version-windows.txt"
          } catch {
            "Version check failed: $_" | Out-File -FilePath "screenshots/clap-host-version-windows.txt"
          }
        }

    - name: Upload CLAP Host Screenshots and Logs
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-screenshots-${{ matrix.os }}-${{ github.sha }}
        path: |
          screenshots/
          clap-host-repo/builds/*/CMakeCache.txt
          clap-host-repo/builds/*/CMakeFiles/config.log
        retention-days: 30
        if-no-files-found: warn
