name: CLAP Plugin Build and Test Pipeline

on:
  pull_request:
    # branches: [ main, master ]
  # push:
    # branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger for testing

permissions:
  contents: write
  pull-requests: write

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'

jobs:
  # Step 1: Build plugin (foundation for all other jobs)
  build-plugin:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Cache vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: |
          libs/vcpkg/installed
          libs/vcpkg/buildtrees
        key: vcpkg-${{ runner.os }}-${{ hashFiles('libs/vcpkg/scripts/ci.baseline.txt') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup Dependencies
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-dependencies.sh "$OS_TYPE"

    - name: Configure CMake
      shell: bash
      run: cmake . -B build

    - name: Build project
      run: cmake --build build --config Release

    - name: Verify Plugin Build
      id: verify
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/verify-plugin-build.sh "$OS_TYPE"

    - name: Upload Plugin Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: |
          build/MyFirstClapPlugin.so
          build/Release/MyFirstClapPlugin.clap
          build/MyFirstClapPlugin.dylib
        retention-days: 10
        if-no-files-found: ignore

  # Step 2: Parallel testing jobs (depend on plugin build)
  unit-tests:
    name: Unit Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Cache vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: |
          libs/vcpkg/installed
          libs/vcpkg/buildtrees
        key: vcpkg-${{ runner.os }}-${{ hashFiles('libs/vcpkg/scripts/ci.baseline.txt') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup Dependencies
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-dependencies.sh "$OS_TYPE"

    - name: Configure and Build
      shell: bash
      run: |
        cmake . -B build
        cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build -C Release --output-on-failure

  clap-validation:
    name: CLAP Validation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Cache clap-tools binaries
      uses: actions/cache@v4
      with:
        path: |
          tools/clap-tools/clap-info
          tools/clap-tools/clap-info.zip
          tools/clap-tools/clap-validator
          tools/clap-tools/clap-validator.tar.gz
        key: clap-tools-${{ runner.os }}-${{ env.CLAP_VALIDATOR_VERSION }}-${{ env.CLAP_INFO_VERSION }}
        restore-keys: |
          clap-tools-${{ runner.os }}-

    - name: Setup CLAP Tools
      shell: bash
      continue-on-error: true
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-clap-tools.sh "$OS_TYPE" "${{ env.CLAP_VALIDATOR_VERSION }}" "${{ env.CLAP_INFO_VERSION }}"

    - name: Validate CLAP Plugin
      shell: bash
      continue-on-error: true
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/validate-clap-plugin.sh "$OS_TYPE"

  clap-host-test:
    name: CLAP Host Integration Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Cache Qt binaries
      uses: actions/cache@v4
      with:
        path: tools/qt/6.5.0
        key: qt-${{ runner.os }}-6.5.0
        restore-keys: |
          qt-${{ runner.os }}-

    - name: Cache vcpkg artifacts for clap-host
      uses: actions/cache@v4
      with:
        path: |
          libs/vcpkg/installed
          libs/vcpkg/buildtrees
        key: vcpkg-${{ runner.os }}-${{ hashFiles('libs/vcpkg/scripts/ci.baseline.txt') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Cache CLAP Host Build
      uses: actions/cache@v4
      id: clap-host-cache
      with:
        path: |
          tools/clap-host/builds/
          tools/clap-host/vcpkg_installed/
        key: clap-host-${{ runner.os }}-qt6-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
        restore-keys: |
          clap-host-${{ runner.os }}-qt6-
          clap-host-${{ runner.os }}-

    - name: Setup CLAP Host Dependencies
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-dependencies.sh "$OS_TYPE"

    - name: Setup MSBuild (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        cached: true

    - name: Setup vcpkg
      if: runner.os != 'Windows'
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/setup-vcpkg.sh "$OS_TYPE"

    - name: Cache Screenshots for Comparison
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: previous-screenshots/
        key: clap-host-screenshots-${{ matrix.os }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
        restore-keys: |
          clap-host-screenshots-${{ matrix.os }}-pr${{ github.event.pull_request.number }}-

    - name: Verify Plugin Artifact
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        ./scripts/verify-plugin-artifact.sh "$OS_TYPE"

    - name: Prepare CLAP Host
      shell: bash
      run: |
        ./scripts/prepare-clap-host.sh

    - name: Build CLAP Host
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        
        if [ "$OS_TYPE" != "windows" ]; then
          export VCPKG_ROOT="${VCPKG_ROOT:-$(pwd)/libs/vcpkg}"
        fi
        
        ./scripts/build-clap-host.sh "$OS_TYPE" "tools/clap-host" "${VCPKG_ROOT:-$(pwd)/libs/vcpkg}"

    - name: Test CLAP Host with Plugin and Take Screenshot
      shell: bash
      run: |
        OS_TYPE="${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}"
        
        case "$OS_TYPE" in
          "linux")
            export PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.so"
            ;;
          "windows")
            export PLUGIN_FILE="$(pwd)/plugin-artifacts/Release/MyFirstClapPlugin.clap"
            ;;
          "macos")
            export PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.dylib"
            ;;
        esac
        
        ./scripts/test-clap-host.sh "$OS_TYPE" "tools/clap-host" "$PLUGIN_FILE" "30"

    - name: Compare Screenshots and Determine Changes
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # If this is the first screenshot in PR or no previous screenshot exists, mark as changed
        if [ ! -f "previous-screenshots/clap-host-linux-screenshot.png" ]; then
          echo "SCREENSHOT_CHANGED=true" >> $GITHUB_ENV
          echo "SCREENSHOT_REASON=first_in_pr" >> $GITHUB_ENV
          echo "No previous screenshot found in PR - this will be uploaded as the first screenshot"
        elif [ -f "screenshots/clap-host-linux-screenshot.png" ]; then
          # Compare with previous screenshot in this PR
          PREV_HASH=$(sha256sum "previous-screenshots/clap-host-linux-screenshot.png" | cut -d' ' -f1)
          NEW_HASH=$(sha256sum "screenshots/clap-host-linux-screenshot.png" | cut -d' ' -f1)
          echo "Previous screenshot hash: $PREV_HASH"
          echo "New screenshot hash: $NEW_HASH"
          echo "NEW_SCREENSHOT_HASH=$NEW_HASH" >> $GITHUB_ENV
          
          if [ "$PREV_HASH" != "$NEW_HASH" ]; then
            echo "SCREENSHOT_CHANGED=true" >> $GITHUB_ENV
            echo "SCREENSHOT_REASON=changed_in_pr" >> $GITHUB_ENV
            echo "Screenshot has changed since last run in this PR"
          else
            echo "SCREENSHOT_CHANGED=false" >> $GITHUB_ENV
            echo "SCREENSHOT_REASON=unchanged" >> $GITHUB_ENV
            echo "Screenshot is identical to previous run in this PR"
          fi
        fi

    - name: Save Current Screenshot for Future Comparison
      if: runner.os == 'Linux' && env.SCREENSHOT_CHANGED == 'true'
      shell: bash
      run: |
        # Save current screenshot for next comparison in this PR
        mkdir -p previous-screenshots/
        if [ -f "screenshots/clap-host-linux-screenshot.png" ]; then
          cp "screenshots/clap-host-linux-screenshot.png" "previous-screenshots/clap-host-linux-screenshot.png"
          echo "Screenshot saved for future comparison in this PR"
        fi

    - name: Upload Screenshot to Release and Comment on PR (Linux only)
      if: runner.os == 'Linux' && github.event_name == 'pull_request' && env.SCREENSHOT_CHANGED == 'true'
      shell: bash
      run: |
        ./scripts/upload-screenshot.sh \
          "${{ secrets.GITHUB_TOKEN }}" \
          "${{ github.repository }}" \
          "${{ github.event.pull_request.number }}" \
          "${{ github.run_id }}" \
          "${{ github.sha }}" \
          "${NEW_SCREENSHOT_HASH:-unknown}" \
          "${SCREENSHOT_REASON:-unknown}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Screenshots and Logs
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-test-results-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: |
          screenshots/
          tools/clap-host/builds/
        retention-days: 5
        if-no-files-found: ignore

    - name: Update Screenshot Cache for Next Run (Linux only)
      if: runner.os == 'Linux' && env.SCREENSHOT_CHANGED == 'true'
      uses: actions/cache/save@v4
      with:
        path: previous-screenshots/
        key: clap-host-screenshots-${{ matrix.os }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
