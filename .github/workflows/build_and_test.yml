name: CLAP Plugin Build and Test Pipeline

on:
  pull_request:
    # branches: [ main, master ]
  # push:
    # branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger for testing

permissions:
  contents: write
  pull-requests: write

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'

jobs:
  # Step 1: Build plugin (foundation for all other jobs)
  build-plugin:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        echo "Installing GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils; then
            echo "GUI dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done

    - name: Configure CMake
      shell: bash
      run: cmake . -B build

    - name: Build project
      run: cmake --build build --config Release

    - name: Verify Plugin Build
      id: verify
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.so"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          PLUGIN_FILE="build/Release/MyFirstClapPlugin.clap"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.dylib"
        fi
        
        if [ -f "$PLUGIN_FILE" ]; then
          echo "Plugin built successfully: $PLUGIN_FILE"
          ls -la "$PLUGIN_FILE"
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "Error: Plugin file not found!"
          ls -la build/ || echo "build directory not found"
          echo "success=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload Plugin Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: |
          build/MyFirstClapPlugin.so
          build/Release/MyFirstClapPlugin.clap
          build/MyFirstClapPlugin.dylib
        retention-days: 10
        if-no-files-found: ignore

  # Step 2: Parallel testing jobs (depend on plugin build)
  unit-tests:
    name: Unit Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup GUI Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
          libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev libxfixes-dev \
          pkg-config build-essential mesa-utils

    - name: Configure and Build
      shell: bash
      run: |
        cmake . -B build
        cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build -C Release --output-on-failure

  clap-validation:
    name: CLAP Validation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Setup CLAP Tools
      shell: bash
      run: |
        echo "=== Setting up CLAP tools for ${{ runner.os }} ==="
        
        if [ "$RUNNER_OS" = "Linux" ]; then
          wget -O clap-validator.tar.gz "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-ubuntu-18.04.tar.gz" || echo "clap-validator download failed"
          if [ -f clap-validator.tar.gz ]; then
            tar -xzf clap-validator.tar.gz && chmod +x clap-validator || echo "clap-validator extraction failed"
          fi
          
          wget -O clap-info.zip "https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-linux-x64.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip && chmod +x clap-info || echo "clap-info extraction failed"
          fi
          
        elif [ "$RUNNER_OS" = "Windows" ]; then
          curl -L -o clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-${{ env.CLAP_VALIDATOR_VERSION }}-windows.zip" || echo "clap-validator download failed"
          if [ -f clap-validator.zip ]; then
            unzip -q clap-validator.zip || echo "clap-validator extraction failed"
          fi
          
          curl -L -o clap-info.zip "https://github.com/free-audio/clap-info/releases/download/${{ env.CLAP_INFO_VERSION }}/clap-info-win-x64.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip || echo "clap-info extraction failed"
          fi
          
        elif [ "$RUNNER_OS" = "macOS" ]; then
          curl -L -o clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/${{ env.CLAP_VALIDATOR_VERSION }}/clap-validator-macos.zip" || echo "clap-validator download failed"
          if [ -f clap-validator.zip ]; then
            unzip -q clap-validator.zip && chmod +x clap-validator || echo "clap-validator extraction failed"
          fi
          
          curl -L -o clap-info.zip "https://github.com/free-audio/clap-info/releases/download/v1.2.2/clap-info-mac-universal.zip" || echo "clap-info download failed"
          if [ -f clap-info.zip ]; then
            unzip -q clap-info.zip && chmod +x clap-info || echo "clap-info extraction failed"
          fi
        fi

    - name: Validate CLAP Plugin
      shell: bash
      run: |
        echo "=== Validating CLAP plugin on ${{ runner.os }} ==="
        
        # Debug: Show what was downloaded
        echo "Contents of plugin-artifacts directory:"
        find plugin-artifacts -type f -name "*.so" -o -name "*.clap" -o -name "*.dylib" 2>/dev/null || echo "No plugin files found"
        ls -la plugin-artifacts/ 2>/dev/null || echo "plugin-artifacts directory not found"
        
        if [ "$RUNNER_OS" = "Linux" ]; then
          PLUGIN_FILE="plugin-artifacts/MyFirstClapPlugin.so"
          VALIDATOR_CMD="./clap-validator"
          INFO_CMD="./clap-info"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # Windows plugin is in Release subdirectory
          if [ -f "plugin-artifacts/Release/MyFirstClapPlugin.clap" ]; then
            PLUGIN_FILE="plugin-artifacts/Release/MyFirstClapPlugin.clap"
          elif [ -f "plugin-artifacts/MyFirstClapPlugin.clap" ]; then
            PLUGIN_FILE="plugin-artifacts/MyFirstClapPlugin.clap"
          else
            echo "Searching for .clap file in all subdirectories..."
            PLUGIN_FILE=$(find plugin-artifacts -name "*.clap" -type f | head -1)
          fi
          VALIDATOR_CMD="./clap-validator.exe"
          INFO_CMD="./clap-info.exe"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          PLUGIN_FILE="plugin-artifacts/MyFirstClapPlugin.dylib"
          VALIDATOR_CMD="./clap-validator"
          INFO_CMD="./clap-info"
        fi
        
        echo "Plugin file: $PLUGIN_FILE"
        
        if [ -f "$PLUGIN_FILE" ]; then
          # Validate the plugin with clap-validator
          if [ -f "$VALIDATOR_CMD" ] || [ -f "${VALIDATOR_CMD}.exe" ]; then
            echo "Validating CLAP plugin with clap-validator..."
            $VALIDATOR_CMD validate "$PLUGIN_FILE" || echo "Validation completed with warnings/errors"
          else
            echo "Warning: clap-validator not available on ${{ runner.os }} - skipping validation"
          fi
          
          # Get plugin info with clap-info
          if [ -f "$INFO_CMD" ] || [ -f "${INFO_CMD}.exe" ]; then
            echo "Getting plugin info with clap-info..."
            $INFO_CMD "$PLUGIN_FILE" --brief || echo "Info extraction completed"
          else
            echo "Warning: clap-info not available on ${{ runner.os }} - skipping info extraction"
          fi
        else
          echo "Error: Plugin file $PLUGIN_FILE not found!"
          ls -la plugin-artifacts/
          exit 1
        fi

  clap-host-test:
    name: CLAP Host Integration Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-plugin
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyFirstClapPlugin-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ github.sha }}
        path: plugin-artifacts/

    - name: Cache CLAP Host Build
      uses: actions/cache@v4
      id: clap-host-cache
      with:
        path: |
          clap-host-repo/builds/
          clap-host-repo/vcpkg_installed/
          vcpkg/installed/
        key: clap-host-${{ runner.os }}-qt6-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
        restore-keys: |
          clap-host-${{ runner.os }}-qt6-
          clap-host-${{ runner.os }}-

    - name: Setup CLAP Host Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        echo "Installing build tools and GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev libxfixes-dev \
            pkg-config build-essential mesa-utils ninja-build cmake git curl \
            zip unzip tar xvfb x11-utils imagemagick scrot; then
            echo "Dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done

        echo "=== Setting up vcpkg ==="
        if [ ! -d "vcpkg" ] || [ ! -f "vcpkg/.git/config" ]; then
          echo "Cloning fresh vcpkg repository..."
          rm -rf vcpkg 2>/dev/null || true
          git clone https://github.com/Microsoft/vcpkg.git vcpkg
        else
          echo "vcpkg directory exists, updating..."
          cd vcpkg && git pull && cd ..
        fi
        
        # Always bootstrap to ensure it's working
        echo "Bootstrapping vcpkg..."
        ./vcpkg/bootstrap-vcpkg.sh
        
        echo "Installing RtMidi and RtAudio via vcpkg..."
        ./vcpkg/vcpkg install rtmidi rtaudio --triplet=x64-linux
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH
        export VCPKG_ROOT="$(pwd)/vcpkg"
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        
        echo "=== Qt6 already installed via install-qt-action ==="
        echo "Skipping Qt6 vcpkg installation - using system Qt6"

    - name: Setup CLAP Host Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Installing essential build tools on macOS..."
        brew install pkg-config ninja cmake git curl

        echo "=== Setting up vcpkg ==="
        if [ ! -d "vcpkg" ] || [ ! -f "vcpkg/.git/config" ]; then
          echo "Cloning fresh vcpkg repository..."
          rm -rf vcpkg 2>/dev/null || true
          git clone https://github.com/Microsoft/vcpkg.git vcpkg
        else
          echo "vcpkg directory exists, updating..."
          cd vcpkg && git pull && cd ..
        fi
        
        # Always bootstrap to ensure it's working
        echo "Bootstrapping vcpkg..."
        ./vcpkg/bootstrap-vcpkg.sh
        
        echo "Installing RtMidi and RtAudio via vcpkg..."
        ./vcpkg/vcpkg install rtmidi rtaudio --triplet=${{ runner.os == 'macOS' && 'arm64-osx' || 'x64-osx' }}
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH
        export VCPKG_ROOT="$(pwd)/vcpkg"
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        
        echo "=== Qt6 already installed via install-qt-action ==="
        echo "Skipping Qt6 vcpkg installation - using system Qt6"

    - name: Setup CLAP Host Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "Windows CLAP host will use scripts/build.sh for static build"
        echo "Dependencies will be handled automatically by the build script"

    - name: Setup MSBuild (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: jurplel/install-qt-action@v4

    - name: Verify Plugin Artifact
      shell: bash
      run: |
        echo "=== Verifying plugin artifact ==="
        echo "Current working directory: $(pwd)"
        echo "Contents of plugin-artifacts directory:"
        ls -la plugin-artifacts/ || echo "plugin-artifacts directory not found"
        
        # Look for plugin in artifact directory
        if [ "$RUNNER_OS" = "Linux" ]; then
          PLUGIN_FILE="plugin-artifacts/MyFirstClapPlugin.so"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # Check multiple possible locations for Windows
          if [ -f "plugin-artifacts/Release/MyFirstClapPlugin.clap" ]; then
            PLUGIN_FILE="plugin-artifacts/Release/MyFirstClapPlugin.clap"
          elif [ -f "plugin-artifacts/MyFirstClapPlugin.clap" ]; then
            PLUGIN_FILE="plugin-artifacts/MyFirstClapPlugin.clap"
          else
            echo "Searching for .clap file in plugin-artifacts..."
            PLUGIN_FILE=$(find plugin-artifacts -name "*.clap" -type f | head -1)
          fi
        elif [ "$RUNNER_OS" = "macOS" ]; then
          PLUGIN_FILE="plugin-artifacts/MyFirstClapPlugin.dylib"
        fi

        echo "Expected plugin file: $PLUGIN_FILE"
        if [ -f "$PLUGIN_FILE" ]; then
          echo "Plugin artifact found successfully"
          ls -la "$PLUGIN_FILE"
          file "$PLUGIN_FILE" || echo "file command failed"
        else
          echo "Error: Plugin file not found at expected location!"
          echo "Contents of plugin-artifacts directory:"
          find plugin-artifacts -type f 2>/dev/null || echo "No files found in plugin-artifacts"
          
          # Try to find any plugin file
          echo "Looking for any plugin files..."
          FOUND_PLUGIN=$(find plugin-artifacts -name "*.so" -o -name "*.clap" -o -name "*.dylib" 2>/dev/null | head -1)
          if [ -n "$FOUND_PLUGIN" ]; then
            echo "Found plugin file: $FOUND_PLUGIN"
            echo "Using found plugin file instead"
            # Export for use in later steps
            echo "PLUGIN_FILE_OVERRIDE=$FOUND_PLUGIN" >> $GITHUB_ENV
          else
            echo "No plugin files found at all!"
            exit 1
          fi
        fi

    - name: Checkout CLAP Host
      shell: bash
      run: |
        echo "Cloning clap-host repository..."
        if [ ! -d "clap-host-repo" ] || [ ! -f "clap-host-repo/.git/config" ]; then
          rm -rf clap-host-repo 2>/dev/null || true
          git clone --recurse-submodules https://github.com/free-audio/clap-host.git clap-host-repo
        else
          echo "clap-host-repo already exists, updating..."
          cd clap-host-repo
          git pull --recurse-submodules || echo "Git pull failed, continuing with existing version"
          cd ..
        fi

    - name: Build CLAP Host (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on ${{ runner.os }} ==="

        mkdir -p ../screenshots

        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        
        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"
        
        # Check available presets
        echo "Available CMake presets:"
        cmake --list-presets 2>/dev/null || echo "No presets available"
        
        # Try vcpkg-based build first
        BUILD_SUCCESS=false
        
        # Manual build with vcpkg toolchain
        echo "Trying manual build with vcpkg toolchain"
        if cmake . -B builds/vcpkg-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
          -DVCPKG_TARGET_TRIPLET=${{ runner.os == 'macOS' && 'arm64-osx' || 'x64-linux' }} \
          -DUsePkgConfig=OFF \
          2>&1 | tee ../screenshots/cmake-vcpkg-configure-log-${{ runner.os }}.txt; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release 2>&1 | tee ../screenshots/cmake-vcpkg-build-log-${{ runner.os }}.txt; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi
        
        # Fallback to preset if vcpkg manual build failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "vcpkg manual build failed, trying ninja-system preset"
          if cmake --preset ninja-system 2>&1 | tee ../screenshots/cmake-preset-configure-log-${{ runner.os }}.txt; then
            echo "ninja-system preset configuration successful"
            if cmake --build --preset ninja-system 2>&1 | tee ../screenshots/cmake-preset-build-log-${{ runner.os }}.txt; then
              echo "ninja-system preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi
        
        # Last resort: simple cmake build without specific dependencies
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "All advanced builds failed, trying simple build"
          if cmake . -B builds/simple -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../screenshots/cmake-simple-configure-log-${{ runner.os }}.txt; then
            echo "Simple configuration successful"
            if cmake --build builds/simple --config Release 2>&1 | tee ../screenshots/cmake-simple-build-log-${{ runner.os }}.txt; then
              echo "Simple build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed"
          echo "Build failed on ${{ runner.os }}" > ../screenshots/build-failed-${{ runner.os }}.txt
          exit 1
        fi

        # Find the built executable
        echo "=== Finding CLAP Host executable ==="
        find builds -name "clap-host*" -type f 2>/dev/null | tee ../screenshots/found-executables-${{ runner.os }}.txt || echo "No clap-host executable found"

    - name: Build CLAP Host (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on Windows ==="

        mkdir -p ../screenshots

        # Try different build approaches, prioritizing static build script
        BUILD_SUCCESS=false

        # Try build script first for static build (primary method)
        if [ -f "scripts/build.sh" ]; then
          echo "Trying static build script (scripts/build.sh)"
          chmod +x scripts/build.sh
          if ./scripts/build.sh 2>&1 | tee ../screenshots/build-script-log-windows.txt; then
            echo "Build script successful (static build)"
            BUILD_SUCCESS=true
          else
            echo "Build script failed, trying other methods"
          fi
        else
          echo "scripts/build.sh not found, trying other build methods"
        fi

        # Fallback to simple cmake build
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "Trying simple cmake build"
          if cmake -B builds/simple -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../screenshots/cmake-simple-configure-log-windows.txt; then
            echo "Simple configuration successful"
            if cmake --build builds/simple --config Release 2>&1 | tee ../screenshots/cmake-simple-build-log-windows.txt; then
              echo "Simple build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed"
          echo "Build failed on Windows" > ../screenshots/build-failed-windows.txt
          exit 1
        fi

        # Find the built executable
        echo "=== Finding CLAP Host executable ==="
        find builds -name "clap-host*" -type f 2>/dev/null | tee ../screenshots/found-executables-windows.txt || echo "No clap-host executable found"

    - name: Test CLAP Host with Plugin and Take Screenshot (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on Linux ==="
        
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f | head -10
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"
        
        # Use override if available, otherwise use standard path
        if [ -n "$PLUGIN_FILE_OVERRIDE" ]; then
          PLUGIN_FILE="$(pwd)/$PLUGIN_FILE_OVERRIDE"
          echo "Using plugin file override: $PLUGIN_FILE"
        else
          PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.so"
        fi
        
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          echo "Contents of plugin-artifacts:"
          find plugin-artifacts -type f 2>/dev/null || echo "plugin-artifacts directory empty or not found"
          ls -la plugin-artifacts/
          exit 1
        fi
        
        mkdir -p screenshots
        
        # Test with virtual display and take screenshot
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
        XVFB_PID=$!
        sleep 5
        
        # Calculate screenshot hash before running
        PREV_HASH=""
        if [ -f "screenshots/clap-host-linux-screenshot.png" ]; then
          PREV_HASH=$(sha256sum screenshots/clap-host-linux-screenshot.png | awk '{print $1}')
        fi
        
        # Test clap-host and take screenshot
        timeout 30s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 15
          import -window root screenshots/clap-host-linux-screenshot-new.png 2>/dev/null || scrot screenshots/clap-host-linux-screenshot-new.png 2>/dev/null || echo 'Screenshot failed'
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "Screenshot capture completed"
        
        kill $XVFB_PID 2>/dev/null || true
        
        # Calculate new screenshot hash and compare
        if [ -f "screenshots/clap-host-linux-screenshot-new.png" ]; then
          NEW_HASH=$(sha256sum screenshots/clap-host-linux-screenshot-new.png | awk '{print $1}')
          echo "Previous hash: $PREV_HASH"
          echo "New hash: $NEW_HASH"
          
          if [ "$NEW_HASH" != "$PREV_HASH" ]; then
            echo "Screenshot differs from previous version"
            mv screenshots/clap-host-linux-screenshot-new.png screenshots/clap-host-linux-screenshot.png
            echo "NEW_SCREENSHOT_HASH=$NEW_HASH" >> $GITHUB_ENV
            echo "SCREENSHOT_CHANGED=true" >> $GITHUB_ENV
          else
            echo "Screenshot is identical to previous version - no upload needed"
            rm -f screenshots/clap-host-linux-screenshot-new.png
            echo "SCREENSHOT_CHANGED=false" >> $GITHUB_ENV
          fi
        else
          echo "Screenshot failed, capturing diagnostic info"
          echo "Screenshot failed on Linux" > screenshots/error-linux.txt
          "$CLAP_HOST_EXEC" --version > screenshots/clap-host-version-linux.txt 2>&1 || echo "Version check failed"
          echo "SCREENSHOT_CHANGED=false" >> $GITHUB_ENV
        fi

    - name: Test CLAP Host with Plugin and Take Screenshot (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on macOS (screenshot disabled) ==="
        
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f | head -10
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"
        
        # Use override if available, otherwise use standard path
        if [ -n "$PLUGIN_FILE_OVERRIDE" ]; then
          PLUGIN_FILE="$(pwd)/$PLUGIN_FILE_OVERRIDE"
          echo "Using plugin file override: $PLUGIN_FILE"
        else
          PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.dylib"
        fi
        
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          echo "Contents of plugin-artifacts:"
          find plugin-artifacts -type f 2>/dev/null || echo "plugin-artifacts directory empty or not found"
          ls -la plugin-artifacts/
          exit 1
        fi
        
        mkdir -p screenshots
        
        # Test clap-host (no screenshot on macOS as requested)
        echo "Testing clap-host functionality without screenshot..."
        timeout 15s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 10
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "CLAP Host test completed"
        
        echo "CLAP Host test completed on macOS (no screenshot)" > screenshots/clap-host-test-macos.txt
        echo "SCREENSHOT_CHANGED=false" >> $GITHUB_ENV

    - name: Test CLAP Host with Plugin and Take Screenshot (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on Windows (screenshot disabled) ==="
        
        # Find clap-host executable
        CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host*.exe" -type f | head -1)
        if [ -z "$CLAP_HOST_EXEC" ]; then
          CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
        fi
        
        if [ -z "$CLAP_HOST_EXEC" ]; then
          echo "Error: clap-host executable not found!"
          find clap-host-repo -name "*clap*" -type f | head -10
          exit 1
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        
        # Use override if available, otherwise find Windows plugin file
        if [ -n "$PLUGIN_FILE_OVERRIDE" ]; then
          PLUGIN_FILE="$(pwd)/$PLUGIN_FILE_OVERRIDE"
          echo "Using plugin file override: $PLUGIN_FILE"
        elif [ -f "$(pwd)/plugin-artifacts/Release/MyFirstClapPlugin.clap" ]; then
          PLUGIN_FILE="$(pwd)/plugin-artifacts/Release/MyFirstClapPlugin.clap"
        elif [ -f "$(pwd)/plugin-artifacts/MyFirstClapPlugin.clap" ]; then
          PLUGIN_FILE="$(pwd)/plugin-artifacts/MyFirstClapPlugin.clap"
        else
          echo "Searching for .clap file in plugin-artifacts..."
          PLUGIN_FILE=$(find "$(pwd)/plugin-artifacts" -name "*.clap" -type f | head -1)
        fi
        
        if [ ! -f "$PLUGIN_FILE" ]; then
          echo "Error: Plugin file not found at $PLUGIN_FILE"
          echo "Contents of plugin-artifacts:"
          find plugin-artifacts -type f 2>/dev/null || echo "plugin-artifacts directory empty or not found"
          ls -la plugin-artifacts/
          exit 1
        fi
        
        mkdir -p screenshots
        
        # Test clap-host (no screenshot on Windows as requested)
        echo "Testing clap-host functionality without screenshot..."
        timeout 15s bash -c "
          '$CLAP_HOST_EXEC' -p '$PLUGIN_FILE' &
          CLAP_PID=\$!
          sleep 10  
          kill \$CLAP_PID 2>/dev/null || true
        " || echo "CLAP Host test completed"
        
        echo "CLAP Host test completed on Windows (no screenshot)" > screenshots/clap-host-test-windows.txt
        echo "SCREENSHOT_CHANGED=false" >> $GITHUB_ENV

    - name: Upload Screenshot to Release and Comment on PR (Linux only)
      if: runner.os == 'Linux' && env.SCREENSHOT_CHANGED == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "=== Uploading screenshot to release ==="
        
        # Check if screenshot exists
        if [ ! -f "screenshots/clap-host-linux-screenshot.png" ]; then
          echo "Screenshot file not found, skipping upload"
          exit 0
        fi
        
        # Create unique filename with multiple identifiers to avoid conflicts
        SCREENSHOT_FILENAME="clap-host-linux-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.sha }}.png"
        cp screenshots/clap-host-linux-screenshot.png "$SCREENSHOT_FILENAME"
        
        # Ensure shared screenshots release exists
        echo "Checking for screenshots release..."
        if ! gh release view screenshots >/dev/null 2>&1; then
          echo "Creating screenshots release..."
          gh release create screenshots --title "CLAP Host Screenshots" --notes "Shared screenshots from CLAP host integration tests"
        fi
        
        # Upload screenshot to release
        echo "Uploading screenshot to release..."
        gh release upload screenshots "$SCREENSHOT_FILENAME" --clobber
        
        # Get the asset URL
        ASSET_URL="https://github.com/${{ github.repository }}/releases/download/screenshots/$SCREENSHOT_FILENAME"
        
        # Comment on PR with screenshot
        echo "Commenting on PR with screenshot..."
        gh pr comment ${{ github.event.pull_request.number }} --body "## CLAP Host Screenshot (Linux)

スクリーンショットが更新されました。

📸 新しいスクリーンショット: [![screenshot](${ASSET_URL})](${ASSET_URL})

- 🔗 [全てのスクリーンショットを見る](https://github.com/${{ github.repository }}/releases/tag/screenshots)
- 📁 ファイル名: \`${SCREENSHOT_FILENAME}\`

<!--screenshot-hash:${{ env.NEW_SCREENSHOT_HASH }}-->"
        
        echo "Screenshot upload and comment completed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Screenshots and Logs
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-screenshots-${{ matrix.os }}-${{ github.sha }}
        path: |
          screenshots/
          clap-host-repo/builds/*/CMakeCache.txt
          clap-host-repo/builds/*/CMakeFiles/config.log
        retention-days: 30
        if-no-files-found: warn
