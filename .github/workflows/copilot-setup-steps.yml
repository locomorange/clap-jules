name: "Copilot Setup Steps"

# Copilot Action用の拡張セットアップワークフロー
# CLAP開発に必要な全ツールとCLAP Host環境を構築
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Copilot Actionで認識されるジョブ名
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 共有セットアップスクリプト実行
      - name: Setup CLAP Development Environment
        run: |
          echo "=== Setting up CLAP development environment ==="
          bash scripts/setup-clap-dev.sh --quick
          echo "✓ CLAP development environment setup completed"
          
      # Qt6環境構築
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          cache: true

      # 環境検証
      - name: Verify Complete Environment
        run: |
          echo "=== Environment Verification ==="
          source .env
          
          echo "--- Build Tools ---"
          cmake --version
          ninja --version || echo "Ninja not found"
          gcc --version | head -1
          pkg-config --version
          
          echo "--- CLAP Tools ---"
          clap-validator --help | head -3 || echo "clap-validator not found"
          clap-info --help | head -3 || echo "clap-info not found"
          
          echo "--- vcpkg ---"
          echo "VCPKG_ROOT: $VCPKG_ROOT"
          echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"
          
          echo "--- Qt6 ---"
          qmake --version
          
          echo "--- CLAP Host ---"
          echo "CLAP_HOST_PATH: $CLAP_HOST_PATH"
          ls -la clap-host-repo/ | head -5
          
          echo "✓ All environment components verified"

      # テストビルド実行
      - name: Test Plugin Build
        run: |
          echo "=== Testing plugin build ==="
          source .env
          
          # プラグインビルド
          ./scripts/build-plugin.sh
          
          # 成果物確認
          if [ -f "build/MyFirstClapPlugin.so" ]; then
            echo "✓ Plugin built successfully"
            ls -la build/MyFirstClapPlugin.so
          else
            echo "✗ Plugin build failed"
            exit 1
          fi
          
          echo "✓ Plugin build test completed"

      # CLAP Host統合テスト
      - name: Test CLAP Host Integration
        run: |
          echo "=== Testing CLAP Host integration ==="
          source .env
          
          # CLAP Hostテスト実行
          ./scripts/test-clap-host.sh
          
          # スクリーンショット確認
          if [ -f "screenshots/clap-host-screenshot.png" ]; then
            echo "✓ CLAP Host test completed with screenshot"
            ls -la screenshots/clap-host-screenshot.png
          else
            echo "⚠ CLAP Host test completed without screenshot"
          fi
          
          echo "✓ CLAP Host integration test completed"

      # 環境情報サマリー
      - name: Environment Summary
        run: |
          echo "=== Copilot Environment Setup Summary ==="
          source .env
          echo "This environment is now ready for CLAP development with:"
          echo "- ✓ Complete build toolchain (CMake, Ninja, GCC)"
          echo "- ✓ CLAP validation tools (clap-validator, clap-info)"
          echo "- ✓ vcpkg package manager with RtMidi/RtAudio"
          echo "- ✓ Qt6 for GUI development"
          echo "- ✓ CLAP Host for integration testing"
          echo "- ✓ X11 virtual display for screenshot capture"
          echo "- ✓ Build scripts for automated workflows"
          echo ""
          echo "Key paths:"
          echo "- VCPKG_ROOT: $VCPKG_ROOT"
          echo "- CLAP_HOST_PATH: $CLAP_HOST_PATH"
          echo "- CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"
          echo ""
          echo "Available commands:"
          echo "- ./scripts/build-plugin.sh       # Build and validate plugin"
          echo "- ./scripts/test-clap-host.sh     # Integration test with screenshot"
          echo "- ./scripts/setup-clap-dev.sh     # Complete environment setup"
          echo "- source .env                     # Load environment variables"
          echo ""
          echo "Ready for Copilot Coding Agent! 🚀"
