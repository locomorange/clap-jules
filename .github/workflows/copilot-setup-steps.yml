name: Copilot Setup Steps

# Copilot Action用の拡張セットアップワークフロー（スクリプト化版）
# CLAP開発に必要な全ツールとCLAP Host環境を構築
# 注意: プラグインビルドはオプションで、失敗しても環境セットアップは完了とみなす
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps-refactored.yml
      - scripts/**

env:
  CLAP_VALIDATOR_VERSION: '0.3.2'
  CLAP_INFO_VERSION: 'v1.2.2'
  CLAP_TOOLS_PATH: tools/clap-tools

jobs:
  # Copilot Actionで認識されるジョブ名
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # vcpkg成果物のキャッシュ
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            libs/vcpkg/installed
            libs/vcpkg/buildtrees
          key: vcpkg-${{ runner.os }}-${{ hashFiles('libs/vcpkg/scripts/ci.baseline.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # CLAP開発ツールのキャッシュ
      - name: Cache CLAP tools
        uses: actions/cache@v4
        with:
          path: |
            tools/clap-tools/clap-info
            tools/clap-tools/clap-info.zip
            tools/clap-tools/clap-validator
            tools/clap-tools/clap-validator.tar.gz
          key: clap-tools-${{ runner.os }}-${{ env.CLAP_VALIDATOR_VERSION }}-${{ env.CLAP_INFO_VERSION }}
          restore-keys: |
            clap-tools-${{ runner.os }}-

      # ビルド環境の包括的セットアップ
      - name: Setup Build Environment
        shell: bash
        run: |
          ./scripts/setup-dependencies.sh linux

      # CLAP開発ツールのセットアップ
      - name: Setup CLAP Development Tools
        shell: bash
        run: |
          ./scripts/setup-clap-tools.sh linux "${{ env.CLAP_VALIDATOR_VERSION }}" "${{ env.CLAP_INFO_VERSION }}"

      # Qt6環境構築
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          cached: true

      # Qtバイナリのキャッシュ
      - name: Cache Qt binaries
        uses: actions/cache@v4
        with:
          path: tools/qt/6.5.0
          key: qt-${{ runner.os }}-6.5.0
          restore-keys: |
            qt-${{ runner.os }}-

      # vcpkg環境構築
      - name: Setup vcpkg Package Manager
        shell: bash
        run: |
          ./scripts/setup-vcpkg.sh linux

      # Briskビルド成果物のキャッシュ (add_subdirectory integration)
      - name: Cache Brisk Build
        uses: actions/cache@v4
        id: brisk-cache
        with:
          path: |
            build/brisk-bin/
            libs/brisk/vcpkg_installed/
          key: brisk-build-${{ runner.os }}-${{ hashFiles('libs/brisk/CMakeLists.txt', 'libs/brisk/vcpkg.json') }}
          restore-keys: |
            brisk-build-${{ runner.os }}-

      # CLAP Hostビルド成果物のキャッシュ
      - name: Cache CLAP Host Build
        uses: actions/cache@v4
        id: clap-host-cache
        with:
          path: |
            tools/clap-host/builds/
            tools/clap-host/vcpkg_installed/
            clap-host-builds/
          key: clap-host-copilot-setup-${{ runner.os }}-${{ hashFiles('scripts/setup-vcpkg.sh', 'scripts/build-clap-host.sh') }}-v5
          restore-keys: |
            clap-host-copilot-setup-${{ runner.os }}-

      # CLAP_HOST_PATH環境変数設定（キャッシュヒット時）
      - name: Set CLAP_HOST_PATH for Cached Build
        if: steps.clap-host-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "CLAP_HOST_PATH=$(pwd)/tools/clap-host" >> $GITHUB_ENV
          echo "✓ CLAP_HOST_PATH set for cached build: $(pwd)/tools/clap-host"

      # CLAP Hostビルド成果物のキャッシュ
      - name: Cache CLAP Host Build
        uses: actions/cache@v4
        with:
          path: |
            clap-host-repo/
            clap-host-builds/
          key: clap-host-copilot-setup-${{ runner.os }}-${{ hashFiles('scripts/setup-vcpkg.sh', 'scripts/build-clap-host.sh') }}-v4
          restore-keys: |
            clap-host-copilot-setup-${{ runner.os }}-

      # CLAP_HOST_PATH環境変数設定（キャッシュヒット時）
      - name: Set CLAP_HOST_PATH for Cached Build
        if: steps.clap-host-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "CLAP_HOST_PATH=$(pwd)/clap-host-repo" >> $GITHUB_ENV
          echo "✓ CLAP_HOST_PATH set for cached build: $(pwd)/clap-host-repo"

      # CLAP Hostリポジトリ準備
      - name: Prepare CLAP Host Repository
        if: steps.clap-host-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./scripts/prepare-clap-host.sh

      # CLAP Hostビルド
      - name: Build CLAP Host
        if: steps.clap-host-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export VCPKG_ROOT="$(pwd)/libs/vcpkg"
          ./scripts/build-clap-host.sh linux "tools/clap-host" "${VCPKG_ROOT}"
          
          # ビルド成果物を専用ディレクトリに保存
          mkdir -p clap-host-builds
          if [ -d "tools/clap-host/builds" ]; then
            cp -r tools/clap-host/builds/* clap-host-builds/ 2>/dev/null || echo "No build artifacts to cache"
          fi

      # プラグインビルド（Briskキャッシュのため）
      - name: Build Plugin (for Brisk cache generation)
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Building plugin to generate Brisk cache ==="
          
          # Configure CMake
          cmake . -B build -DCMAKE_BUILD_TYPE=Release
          
          # Build plugin (this will build Brisk via add_subdirectory)
          cmake --build build --config Release --target my_clap_plugin
          
          # Verify build results
          if [ -d "build/brisk-bin" ]; then
            echo "✓ Brisk build artifacts generated in build/brisk-bin/"
            ls -la build/brisk-bin/ 2>/dev/null || echo "  No brisk-bin contents"
          fi
          
          if [ -f "build/MyFirstClapPlugin.so" ]; then
            echo "✓ Plugin built successfully"
          else
            echo "⚠ Plugin build failed, but continuing for environment setup"
          fi
          
          echo "✓ Plugin build completed"

      # 環境検証
      - name: Verify Complete Environment
        shell: bash
        run: |
          ./scripts/verify-plugin-build-optional.sh || ./scripts/build-plugin.sh

      # 環境情報サマリー
      - name: Environment Summary
        shell: bash
        run: |
          ./scripts/environment-summary.sh
