name: CLAP Host Integration Test

on:
  pull_request:
    # branches: [ main, master ]
  # push:
    # branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger for testing

jobs:
  build-plugin:
    name: Build Plugin for CLAP Host Testing on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Build Plugin
      shell: bash
      run: |
        echo "=== Building plugin for clap-host testing ==="
        cmake . -B build
        cmake --build build --config Release

        # Verify plugin exists
        if [ "$RUNNER_OS" = "Linux" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.so"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          PLUGIN_FILE="build/Release/MyFirstClapPlugin.clap"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          PLUGIN_FILE="build/MyFirstClapPlugin.dylib"
        fi

        echo "Plugin file: $PLUGIN_FILE"
        if [ -f "$PLUGIN_FILE" ]; then
          echo "Plugin built successfully"
          ls -la "$PLUGIN_FILE"
        else
          echo "Error: Plugin file not found!"
          ls -la build/ || echo "build directory not found"
          exit 1
        fi

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-${{ matrix.os }}-${{ github.sha }}
        path: |
          build/MyFirstClapPlugin.so
          build/Release/MyFirstClapPlugin.clap
          build/MyFirstClapPlugin.dylib
        retention-days: 1
        if-no-files-found: ignore

  clap-host-test:
    name: CLAP Host Test and Screenshot on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-plugin

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download Plugin Artifact
      uses: actions/download-artifact@v4
      with:
        name: plugin-ubuntu-latest-${{ github.sha }}
        path: build/

    - name: Setup CLAP Host Dependencies (Linux)
      run: |
        # Update package database
        sudo apt-get clean
        sudo apt-get update -y
        
        # Install only essential build tools and GUI dependencies
        # Let clap-host handle rtaudio/rtmidi via vcpkg to avoid version conflicts
        echo "Installing build tools and GUI dependencies..."
        for attempt in 1 2 3; do
          if sudo apt-get install -y --no-install-recommends \
            libxrandr-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            pkg-config \
            build-essential \
            mesa-utils \
            ninja-build \
            cmake \
            git \
            curl \
            zip \
            unzip \
            tar \
            xvfb \
            x11-utils \
            imagemagick; then
            echo "Dependencies installed successfully"
            break
          else
            echo "Attempt $attempt failed, retrying..."
            sleep 2
          fi
        done
        
        # Install vcpkg for dependency management
        echo "=== Setting up vcpkg ==="
        git clone https://github.com/Microsoft/vcpkg.git vcpkg
        ./vcpkg/bootstrap-vcpkg.sh
        echo "Installing RtMidi and RtAudio via vcpkg..."
        ./vcpkg/vcpkg install rtmidi rtaudio --triplet=x64-linux
        echo "$(pwd)/vcpkg" >> $GITHUB_PATH
        export VCPKG_ROOT="$(pwd)/vcpkg"
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV

    - name: Install Qt
      uses: jurplel/install-qt-action@v4

    - name: Setup CLAP Host Cache
      uses: actions/cache@v4
      id: clap-host-cache
      with:
        path: |
          clap-host-repo
          clap-host-executable*
        key: clap-host-${{ runner.os }}-${{ hashFiles('clap-host-repo/CMakeLists.txt', 'clap-host-repo/host/CMakeLists.txt') }}-v1
        restore-keys: |
          clap-host-${{ runner.os }}-

    - name: Checkout CLAP Host
      if: steps.clap-host-cache.outputs.cache-hit != 'true'
      run: |
        echo "Cloning clap-host repository..."
        git clone --recurse-submodules https://github.com/free-audio/clap-host.git clap-host-repo
        
    - name: Build CLAP Host (Linux)
      if: steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on ${{ runner.os }} ==="
        
        # Create screenshots directory for potential error logs
        mkdir -p ../screenshots
        
        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        
        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"
        
        # Check available presets
        echo "Available CMake presets:"
        cmake --list-presets 2>/dev/null || echo "No presets available"
        
        # Try vcpkg-based build first
        BUILD_SUCCESS=false
        
        # Manual build with vcpkg toolchain
        echo "Trying manual build with vcpkg toolchain"
        if cmake . -B builds/vcpkg-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DUsePkgConfig=OFF \
          2>&1 | tee ../screenshots/cmake-vcpkg-configure-log-linux.txt; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release 2>&1 | tee ../screenshots/cmake-vcpkg-build-log-linux.txt; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi
        
        # Fallback to preset if vcpkg manual build failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "vcpkg manual build failed, trying ninja-system preset"
          if cmake --preset ninja-system 2>&1 | tee ../screenshots/cmake-preset-configure-log-linux.txt; then
            echo "ninja-system preset configuration successful"
            if cmake --build --preset ninja-system 2>&1 | tee ../screenshots/cmake-preset-build-log-linux.txt; then
              echo "ninja-system preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi
        
        # Last resort: simple cmake build without specific dependencies
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "All advanced builds failed, trying simple build"
          if cmake . -B builds/simple -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../screenshots/cmake-simple-configure-log-linux.txt; then
            echo "Simple configuration successful"
            if cmake --build builds/simple --config Release 2>&1 | tee ../screenshots/cmake-simple-build-log-linux.txt; then
              echo "Simple build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi
        
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed"
          echo "Build failed on Linux" > ../screenshots/build-failed-linux.txt
          exit 1
        fi
        
        # Find the built executable and cache it
        echo "=== Finding CLAP Host executable ==="
        find builds -name "clap-host*" -type f 2>/dev/null | tee ../screenshots/found-executables-linux.txt || echo "No clap-host executable found"
        find . -name "clap-host*" -type f 2>/dev/null | tee -a ../screenshots/found-executables-linux.txt || echo "No clap-host executable found anywhere"
        
        # Copy executable to cache directory
        CLAP_HOST_EXEC=$(find builds -name "clap-host" -type f | head -1)
        if [ -n "$CLAP_HOST_EXEC" ]; then
          cp "$CLAP_HOST_EXEC" ../clap-host-executable || echo "Failed to cache executable"
          echo "Cached clap-host executable for future builds"
        fi
        
    - name: Build CLAP Host (Windows)
      if: runner.os == 'Windows' && steps.clap-host-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd clap-host-repo
        echo "=== Building CLAP Host on Windows ==="
        
        # Create screenshots directory for potential error logs
        mkdir -p ../screenshots
        
        # Set vcpkg toolchain
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        
        echo "Using vcpkg at: $VCPKG_ROOT"
        echo "CMAKE_TOOLCHAIN_FILE: $CMAKE_TOOLCHAIN_FILE"
        
        # Check available presets  
        echo "Available CMake presets:"
        cmake --list-presets 2>/dev/null || echo "No presets available"
        
        # Try different build approaches
        BUILD_SUCCESS=false
        
        # Try manual build with vcpkg first
        echo "Trying manual build with vcpkg toolchain"
        if cmake . -B builds/vcpkg-build \
           -DCMAKE_BUILD_TYPE=Release \
           -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
           -DVCPKG_TARGET_TRIPLET=x64-windows \
           -DUsePkgConfig=OFF \
           2>&1 | tee ../screenshots/cmake-vcpkg-configure-log-windows.txt; then
          echo "vcpkg configuration successful"
          if cmake --build builds/vcpkg-build --config Release 2>&1 | tee ../screenshots/cmake-vcpkg-build-log-windows.txt; then
            echo "vcpkg build successful"
            BUILD_SUCCESS=true
          fi
        fi
        
        # Try vs-vcpkg preset if manual vcpkg failed
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "Trying vs-vcpkg preset"
          if cmake --preset vs-vcpkg 2>&1 | tee ../screenshots/cmake-vs-vcpkg-configure-log-windows.txt; then
            echo "vs-vcpkg preset configuration successful"
            if cmake --build --preset vs-vcpkg --config Release 2>&1 | tee ../screenshots/cmake-vs-vcpkg-build-log-windows.txt; then
              echo "vs-vcpkg preset build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi
        
        # Try build script if presets failed
        if [ "$BUILD_SUCCESS" = "false" ] && [ -f "scripts/build.sh" ]; then
          echo "Trying build script"
          chmod +x scripts/build.sh
          if ./scripts/build.sh 2>&1 | tee ../screenshots/build-script-log-windows.txt; then
            echo "Build script successful"
            BUILD_SUCCESS=true
          fi
        fi
        
        # Manual build as last resort
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "Trying simple manual build for Windows"
          if cmake . -B builds/windows -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../screenshots/cmake-manual-configure-log-windows.txt; then
            echo "Manual configuration successful"
            if cmake --build builds/windows --config Release 2>&1 | tee ../screenshots/cmake-manual-build-log-windows.txt; then
              echo "Manual build successful"
              BUILD_SUCCESS=true
            fi
          fi
        fi
        
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "ERROR: All build attempts failed on Windows"
          echo "Build failed on Windows" > ../screenshots/build-failed-windows.txt
          exit 1
        fi
        
        # Find the built executable and cache it
        echo "=== Finding CLAP Host executable ==="
        find builds -name "clap-host*" -type f 2>/dev/null | tee ../screenshots/found-executables-windows.txt || echo "No clap-host executable found"
        find . -name "clap-host*" -type f 2>/dev/null | tee -a ../screenshots/found-executables-windows.txt || echo "No clap-host executable found anywhere"
        
        # Copy executable to cache directory
        CLAP_HOST_EXEC=$(find builds -name "clap-host.exe" -type f | head -1)
        if [ -n "$CLAP_HOST_EXEC" ]; then
          cp "$CLAP_HOST_EXEC" ../clap-host-executable.exe || echo "Failed to cache executable"
          echo "Cached clap-host executable for future builds"
        fi

    - name: Verify Plugin Artifact
      shell: bash
      run: |
        echo "=== Building plugin for testing ==="
        echo "Current working directory: $(pwd)"
        echo "Contents of current directory:"
        ls -la
        
        # Try to build the plugin
        if cmake . -B build; then
          echo "CMake configuration successful"
        else
          echo "CMake configuration failed, trying direct compilation"
          # Direct compilation fallback for Linux
          echo "Installing dependencies for Linux compilation..."
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev
          echo "Compiling plugin directly..."
          g++ -shared -fPIC -o MyFirstClapPlugin.so my_plugin.cpp \
            -I libs/clap/include -I libs/glfw/include \
            -DHAVE_GLFW=1 -std=c++17 -lGL -lX11 -pthread || echo "Direct compilation failed"
          mkdir -p build && mv MyFirstClapPlugin.so build/ 2>/dev/null || echo "Move failed"
        fi
        
        if [ -d "build" ]; then
          cmake --build build --config Release || echo "Build step failed"
        fi

        # Verify plugin exists
        PLUGIN_FILE="build/MyFirstClapPlugin.so"

        echo "Plugin file: $PLUGIN_FILE"
        if [ -f "$PLUGIN_FILE" ]; then
          echo "Plugin artifact found successfully"
          ls -la "$PLUGIN_FILE"
          file "$PLUGIN_FILE" || echo "file command failed"
        else
          echo "Error: Plugin file not found!"
          echo "Contents of build directory:"
          ls -la build/ || echo "build directory not found"
          echo "Contents of current directory:"
          ls -la .
          echo "Looking for any compiled plugins:"
          find . -name "*.so" 2>/dev/null || echo "No compiled plugins found"
          exit 1
        fi

    - name: Test CLAP Host with Plugin and Take Screenshot (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "=== Testing CLAP Host with Plugin on Linux ==="
        
        # Find clap-host executable - check cache first, then build directory
        CLAP_HOST_EXEC=""
        if [ -f "clap-host-executable" ]; then
          echo "Using cached clap-host executable"
          CLAP_HOST_EXEC="$(pwd)/clap-host-executable"
          chmod +x "$CLAP_HOST_EXEC"
        else
          CLAP_HOST_EXEC=$(find clap-host-repo -name "clap-host" -type f | head -1)
          if [ -z "$CLAP_HOST_EXEC" ]; then
            echo "Error: clap-host executable not found!"
            echo "=== Directory listing ==="
            find clap-host-repo -name "*clap*" -type f | head -10
            ls -la clap-host-repo/builds/ 2>/dev/null || echo "No builds directory"
            exit 1
          fi
          CLAP_HOST_EXEC="$(pwd)/$CLAP_HOST_EXEC"
        fi
        echo "Found clap-host at: $CLAP_HOST_EXEC"
        chmod +x "$CLAP_HOST_EXEC"
        
        # Verify executable works (after installing Qt dependencies)
        echo "=== Testing clap-host executable ==="
        echo "Setting up Qt environment for headless execution..."
        export DISPLAY=:99
        export QT_QPA_PLATFORM=xcb
        export QT_QPA_PLATFORM_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt6/plugins
        export QT_LOGGING_RULES="*.debug=false"
        export QT_XCB_GL_INTEGRATION=none
        export QT_X11_NO_MITSHM=1
        export QT_QUICK_BACKEND=software
        
        # Install Qt dependencies first
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libxcb-cursor0 \
          libxcb-cursor-dev \
          libxcb-xinerama0 \
          libxcb-randr0 \
          libxcb-xtest0 \
          libxcb-xkb1 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-sync1 \
          libxcb-xfixes0 \
          libxkbcommon-x11-0 \
          qt6-base-dev \
          qt6-base-private-dev \
          2>/dev/null || echo "Some Qt packages may not be available"
        
        # Kill any existing display and start fresh virtual display
        pkill -f "Xvfb :99" 2>/dev/null || true
        rm -f /tmp/.X99-lock 2>/dev/null || true
        sleep 2
        Xvfb :99 -screen 0 1024x768x24 &
        XVFB_TEST_PID=$!
        sleep 5
        
        if ! timeout 10s "$CLAP_HOST_EXEC" --version 2>&1; then
          echo "Warning: clap-host version check failed, but continuing with test"
          file "$CLAP_HOST_EXEC"
          ldd "$CLAP_HOST_EXEC" 2>/dev/null || echo "ldd failed"
        fi
        
        # Stop test display
        kill $XVFB_TEST_PID 2>/dev/null || true
        
        # Plugin path
        PLUGIN_FILE="$(pwd)/build/MyFirstClapPlugin.so"
        
        # Create screenshot directory
        mkdir -p screenshots
        
        # Test clap-host with virtual display and take screenshot
        echo "Starting virtual display and taking screenshot..."
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
        XVFB_PID=$!
        sleep 5

        # Test clap-host help first
        echo "=== Testing clap-host help ==="
        echo "Executable path: $CLAP_HOST_EXEC"
        echo "Executable permissions: $(ls -la "$CLAP_HOST_EXEC")"
        "$CLAP_HOST_EXEC" --help || echo "Help command failed"
        
        # Run clap-host with plugin and take screenshot after a delay
        echo "=== Running clap-host with plugin ==="
        export LIBGL_ALWAYS_SOFTWARE=1
        echo "LIBGL_ALWAYS_SOFTWARE set to $LIBGL_ALWAYS_SOFTWARE"
        
        # Create screenshots directory if it doesn't exist
        mkdir -p screenshots
        
        timeout 60s bash -c "
          echo 'Testing clap-host arguments support...'
          \"$CLAP_HOST_EXEC\" --help > screenshots/clap-host-help-linux.txt 2>&1 || echo 'Help command failed'
          
          echo 'Starting clap-host with GUI arguments...'
          echo 'CLAP Host executable: $CLAP_HOST_EXEC'
          echo 'Plugin file: $PLUGIN_FILE'
          
          # Check if files exist before starting
          if [ ! -f \"$CLAP_HOST_EXEC\" ]; then
            echo 'ERROR: CLAP Host executable not found at: $CLAP_HOST_EXEC'
            exit 1
          fi
          
          if [ ! -f \"$PLUGIN_FILE\" ]; then
            echo 'ERROR: Plugin file not found at: $PLUGIN_FILE'
            exit 1
          fi
          
          if grep -q 'show-gui' screenshots/clap-host-help-linux.txt 2>/dev/null; then
            echo 'Using GUI-specific arguments'
            \"$CLAP_HOST_EXEC\" -p \"$PLUGIN_FILE\" --show-gui --no-minimized &
          else
            echo 'Using basic arguments'
            \"$CLAP_HOST_EXEC\" -p \"$PLUGIN_FILE\" &
          fi
          
          CLAP_PID=\$!
          echo \"Started clap-host with PID: \$CLAP_PID\"
          
          # Wait longer for GUI to appear
          sleep 10
          if kill -0 \$CLAP_PID 2>/dev/null; then
            echo 'Process is running, waiting for GUI to load...'
            sleep 30  # Increased wait time for GUI to load
          else
            echo 'Warning: clap-host process may have exited early, checking logs...'
            wait \$CLAP_PID
            EXIT_CODE=\$?
            echo \"Process exited with code: \$EXIT_CODE\"
            
            echo 'Retrying with basic args...'
            \"$CLAP_HOST_EXEC\" -p \"$PLUGIN_FILE\" &
            CLAP_PID=\$!
            echo \"Restarted clap-host with PID: \$CLAP_PID\"
            sleep 25
          fi
          
          echo 'Checking for GUI windows...'
          xwininfo -root -tree | grep -i clap > screenshots/clap-windows-linux.txt 2>&1 || echo 'No CLAP windows found'
          
          echo 'Taking screenshot...'
          import -window root screenshots/clap-host-linux-screenshot.png 2>/dev/null || echo 'Screenshot failed'
          
          # Keep process running a bit longer for screenshot
          sleep 5
          
          kill \$CLAP_PID 2>/dev/null || true
          echo 'Screenshot capture completed'
        " || echo "Screenshot capture completed (timeout expected)"
        
        # Stop virtual display
        kill $XVFB_PID 2>/dev/null || true
        
        # Verify screenshot was created
        if [ -f "screenshots/clap-host-linux-screenshot.png" ]; then
          echo "Screenshot captured successfully"
          ls -la screenshots/clap-host-linux-screenshot.png
        else
          echo "Warning: Screenshot not created, capturing error info"
          echo "CLAP Host test failed on Linux" > screenshots/error-linux.txt
          "$CLAP_HOST_EXEC" --version > screenshots/clap-host-version-linux.txt 2>&1 || echo "Version check failed"
        fi


    - name: Upload Screenshots and Logs
      uses: actions/upload-artifact@v4
      with:
        name: clap-host-screenshots-linux-${{ github.sha }}
        path: |
          screenshots/
          clap-host-repo/builds/*/CMakeCache.txt
          clap-host-repo/builds/*/CMakeFiles/config.log
        retention-days: 30
        if-no-files-found: warn
